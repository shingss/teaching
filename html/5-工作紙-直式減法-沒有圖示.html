<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Subtraction - Tracing Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300&display=swap" rel="stylesheet">
    <style>
        body { background: #f1f5f9; min-height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Noto Sans TC', system-ui, sans-serif; }
        .config-panel { background: white; border-radius: 1.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.05); padding: 1.5rem; margin-bottom: 1.5rem; }
        
        .vertical-math-box { 
            font-family: 'Courier New', Courier, monospace; 
            background: white; 
            border: 2px solid #e2e8f0; 
            padding: 30px 50px; 
            border-radius: 1.5rem; 
            position: relative; 
            width: fit-content; 
            margin: 0 auto; 
        }

        .v-table { border-collapse: collapse; font-size: 3.8rem; text-align: center; z-index: 1; position: relative; }
        .v-table th { font-size: 1rem; padding-bottom: 12px; width: 85px; color: #64748b; font-family: system-ui; text-transform: uppercase; }
        .v-table td { width: 85px; height: 95px; transition: all 0.3s; }
        
        /* 虛線數字樣式 */
        .tracing-text {
            color: #e2e8f0 !important; /* 淺灰色 */
            text-shadow: 1px 1px 0px #fff;
            -webkit-text-stroke: 1px #cbd5e0; /* 模擬虛線輪廓 */
            font-style: italic; /* 輕微傾斜增加描寫感 */
        }

        .answer-input {
            width: 75px; height: 80px;
            border-bottom: 3px dashed #cbd5e0;
            text-align: center; font-size: 3.8rem;
            color: #2563eb; background: transparent;
            outline: none; transition: 0.2s;
        }
        .answer-input:focus { border-bottom-color: #3b82f6; background: #eff6ff; }

        .v-line { border-bottom: 4px solid #1e293b; }
        .v-operator { color: #ef4444; font-weight: bold; text-align: left; font-size: 3.5rem; padding-right: 10px; }
        .highlight-ones { background: rgba(34, 197, 94, 0.05); }

        #sketch-canvas { position: absolute; top: 0; left: 0; z-index: 10; cursor: crosshair; touch-action: none; }
        
        .tab-btn { padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: bold; font-size: 0.85rem; transition: 0.2s; }
        .tab-btn.active { background: #3b82f6; color: white; }
        .tab-btn.inactive { background: #e2e8f0; color: #64748b; }
        
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="p-4">

<div class="max-w-5xl w-full">
    <div class="flex justify-between items-center mb-4">
        <h1 class="text-xl font-bold text-slate-700">Math Master v3.0</h1>
        <div class="flex gap-2">
            <button onclick="setLang('zh')" id="lang-zh" class="px-3 py-1 rounded text-sm font-bold border-2 border-blue-500">中文</button>
            <button onclick="setLang('en')" id="lang-en" class="px-3 py-1 rounded text-sm font-bold border-2 border-slate-300 text-slate-500">EN</button>
        </div>
    </div>

    <div class="config-panel">
        <div class="flex gap-4 mb-6 border-b pb-4">
            <button onclick="switchMode('random')" id="tab-random" class="tab-btn active" data-zh="🎲 隨機模式" data-en="🎲 Random">🎲 隨機模式</button>
            <button onclick="switchMode('manual')" id="tab-manual" class="tab-btn inactive" data-zh="✍️ 自訂模式" data-en="✍️ Manual">✍️ 自訂模式</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div id="mode-random-content" class="md:col-span-1 space-y-2">
                <h3 class="font-bold text-sm text-gray-700" data-zh="題目設定" data-en="Settings">題目設定</h3>
                <div class="flex gap-1">
                    <input type="number" id="min-range" class="w-1/2 p-2 border rounded text-sm" value="20">
                    <input type="number" id="max-range" class="w-1/2 p-2 border rounded text-sm" value="999">
                </div>
                <select id="borrow-select" class="w-full p-2 border rounded bg-gray-50 text-xs">
                    <option value="any" data-zh="隨機出題" data-en="Random All">隨機出題</option>
                    <option value="must" data-zh="強制退位" data-en="Must Borrow">強制退位</option>
                    <option value="none" data-zh="不需退位" data-en="No Borrow">不需退位</option>
                </select>
            </div>

            <div id="mode-manual-content" class="md:col-span-1 space-y-2 hidden">
                <h3 class="font-bold text-sm text-gray-700" data-zh="輸入題目" data-en="Numbers">輸入題目</h3>
                <input type="number" id="custom-n1" class="w-full p-2 border rounded text-sm mb-1" placeholder="Minuend">
                <input type="number" id="custom-n2" class="w-full p-2 border rounded text-sm" placeholder="Subtrahend">
            </div>

            <div class="md:col-span-2 grid grid-cols-2 gap-4">
                <div class="space-y-2">
                    <h3 class="font-bold text-sm text-gray-700" data-zh="輔助功能" data-en="Assist">輔助功能</h3>
                    <label class="flex items-center gap-2 text-xs">
                        <input type="checkbox" id="check-color" checked onchange="updateUI()"> <span data-zh="個位底色" data-en="Ones BG">個位底色</span>
                    </label>
                    <label class="flex items-center gap-2 text-xs">
                        <input type="checkbox" id="check-fill" checked onchange="updateUI()"> <span data-zh="自動填寫" data-en="Auto Fill">自動填寫</span>
                    </label>
                </div>
                <div class="space-y-2">
                    <h3 class="font-bold text-sm text-blue-600" data-zh="特殊樣式" data-en="Styles">特殊樣式</h3>
                    <label class="flex items-center gap-2 text-xs font-bold text-blue-600">
                        <input type="checkbox" id="check-tracing" onchange="updateUI()"> <span data-zh="虛線數字" data-en="Tracing Mode">虛線數字</span>
                    </label>
                </div>
            </div>

            <div class="flex items-end">
                <button onclick="handleStart()" id="main-btn" class="w-full bg-blue-600 text-white h-10 rounded-lg font-bold hover:bg-blue-700 shadow-lg transition-all" data-zh="🚀 開始" data-en="🚀 Go">
                    🚀 開始
                </button>
            </div>
        </div>
    </div>

    <div class="text-center">
        <div id="problem-display" class="text-3xl font-black text-slate-800 mb-6 tracking-wider"></div>

        <div id="math-container" class="vertical-math-box">
            <canvas id="sketch-canvas"></canvas>
            <table class="v-table">
                <thead>
                    <tr>
                        <th></th>
                        <th id="label-th" data-zh="千" data-en="Tho">千</th>
                        <th id="label-h" data-zh="百" data-en="Hun">百</th>
                        <th id="label-t" data-zh="十" data-en="Ten">十</th>
                        <th id="label-o" data-zh="個" data-en="One">個</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td></td>
                        <td id="v-n1-th"></td><td id="v-n1-h"></td><td id="v-n1-t"></td><td id="v-n1-o"></td>
                    </tr>
                    <tr class="v-line">
                        <td class="v-operator">－</td>
                        <td id="v-n2-th"></td><td id="v-n2-h"></td><td id="v-n2-t"></td><td id="v-n2-o"></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td id="ans-th"><input type="number" class="answer-input" id="in-th"></td>
                        <td id="ans-h"><input type="number" class="answer-input" id="in-h"></td>
                        <td id="ans-t"><input type="number" class="answer-input" id="in-t"></td>
                        <td id="ans-o"><input type="number" class="answer-input" id="in-o"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-8 flex justify-center gap-6 items-center">
            <button onclick="clearCanvas()" class="text-slate-400 text-sm font-bold hover:text-slate-600 underline" data-zh="清除草稿" data-en="Clear Ink">清除草稿</button>
            <button onclick="checkAnswer()" class="bg-emerald-500 text-white px-8 py-2 rounded-full font-bold hover:bg-emerald-600 shadow-lg" data-zh="檢查答案" data-en="Verify">檢查答案</button>
        </div>
        <div id="feedback" class="mt-4 text-2xl font-bold h-8"></div>
    </div>
</div>

<script>
    let n1 = 0, n2 = 0, currentMode = 'random', currentLang = 'zh';
    const canvas = document.getElementById('sketch-canvas');
    const ctx = canvas.getContext('2d');
    const mathBox = document.getElementById('math-container');

    const langLib = {
        zh: { correct: "❤️ 非常正確！", wrong: "💡 再檢查一下喔！", smaller: "數字錯誤！" },
        en: { correct: "❤️ Correct!", wrong: "💡 Keep trying!", smaller: "Invalid Numbers!" }
    };

    function setLang(lang) {
        currentLang = lang;
        document.querySelectorAll('[data-zh]').forEach(el => el.innerText = el.getAttribute(`data-${lang}`));
        document.getElementById('lang-zh').className = `px-3 py-1 rounded text-sm font-bold border-2 ${lang==='zh'?'bg-blue-500 text-white border-blue-500':'bg-white text-slate-500 border-slate-300'}`;
        document.getElementById('lang-en').className = `px-3 py-1 rounded text-sm font-bold border-2 ${lang==='en'?'bg-blue-500 text-white border-blue-500':'bg-white text-slate-500 border-slate-300'}`;
        switchMode(currentMode);
        if(n1) updateUI();
    }

    function switchMode(mode) {
        currentMode = mode;
        document.getElementById('tab-random').classList.toggle('active', mode==='random');
        document.getElementById('tab-random').classList.toggle('inactive', mode!=='random');
        document.getElementById('tab-manual').classList.toggle('active', mode==='manual');
        document.getElementById('tab-manual').classList.toggle('inactive', mode!=='manual');
        document.getElementById('mode-random-content').classList.toggle('hidden', mode !== 'random');
        document.getElementById('mode-manual-content').classList.toggle('hidden', mode !== 'manual');
    }

    function handleStart() {
        if(currentMode === 'random') {
            const min = parseInt(document.getElementById('min-range').value) || 20;
            const max = parseInt(document.getElementById('max-range').value) || 999;
            const bMode = document.getElementById('borrow-select').value;
            let attempts = 0;
            while(attempts < 500) {
                let t1 = Math.floor(Math.random() * (max - min + 1)) + min;
                let t2 = Math.floor(Math.random() * (t1 - 1)) + 1;
                let s1 = t1.toString().split('').reverse(), s2 = t2.toString().split('').reverse();
                let needs = false;
                for(let i=0; i<s2.length; i++) if(parseInt(s2[i]) > parseInt(s1[i]||0)) needs = true;
                
                if(bMode === 'any' || (bMode === 'must' && needs) || (bMode === 'none' && !needs)) { n1 = t1; n2 = t2; break; }
                attempts++;
            }
        } else {
            n1 = parseInt(document.getElementById('custom-n1').value);
            n2 = parseInt(document.getElementById('custom-n2').value);
            if(!n1 || !n2 || n1 < n2) return alert(langLib[currentLang].smaller);
        }
        document.getElementById('feedback').innerText = "";
        ['th','h','t','o'].forEach(p => document.getElementById('in-'+p).value = "");
        updateUI();
    }

    function updateUI() {
        if(!n1) return;
        document.getElementById('problem-display').innerText = `${n1} － ${n2} ＝ ？`;
        const autoFill = document.getElementById('check-fill').checked;
        const showColor = document.getElementById('check-color').checked;
        const isTracing = document.getElementById('check-tracing').checked;
        
        const s1 = n1.toString().padStart(4, ' '), s2 = n2.toString().padStart(4, ' ');
        const places = ['th', 'h', 't', 'o'];

        places.forEach((p, i) => {
            const cell1 = document.getElementById(`v-n1-${p}`);
            const cell2 = document.getElementById(`v-n2-${p}`);
            
            cell1.innerText = (autoFill && s1[i] !== ' ') ? s1[i] : '';
            cell2.innerText = (autoFill && s2[i] !== ' ') ? s2[i] : '';

            // 套用虛線樣式
            cell1.className = isTracing ? 'tracing-text' : '';
            cell2.className = isTracing ? 'tracing-text' : '';

            const isHide = (p === 'th' && n1 < 1000) || (p === 'h' && n1 < 100);
            const d = isHide ? 'none' : 'table-cell';
            document.querySelectorAll(`[id$="-${p}"]`).forEach(el => el.style.display = d);
            
            const isO = (p === 'o' && showColor);
            [document.getElementById(`label-${p}`), cell1, cell2, document.getElementById(`ans-${p}`)].forEach(el => el.classList.toggle('highlight-ones', isO));
        });
        clearCanvas();
        setTimeout(resizeCanvas, 50);
    }

    function checkAnswer() {
        const uVal = ['th','h','t','o'].map(p => document.getElementById('in-'+p).style.display!=='none' ? document.getElementById('in-'+p).value : '').join('');
        if(parseInt(uVal) === (n1 - n2)) {
            document.getElementById('feedback').innerText = langLib[currentLang].correct;
            document.getElementById('feedback').style.color = "#059669";
        } else {
            document.getElementById('feedback').innerText = langLib[currentLang].wrong;
            document.getElementById('feedback').style.color = "#e11d48";
        }
    }

    // Canvas 繪圖邏輯
    let drawing = false;
    function resizeCanvas() {
        canvas.width = mathBox.offsetWidth; canvas.height = mathBox.offsetHeight;
        ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    }
    function draw(e) {
        if (!drawing) return;
        const r = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches?.[0].clientX) - r.left;
        const y = (e.clientY || e.touches?.[0].clientY) - r.top;
        ctx.lineTo(x, y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y);
    }
    canvas.addEventListener('mousedown', () => drawing = true);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', () => { drawing = false; ctx.beginPath(); });
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); drawing = true; });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });
    function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    window.onload = () => { setLang('zh'); handleStart(); };
    window.onresize = resizeCanvas;
</script>
</body>
</html>
