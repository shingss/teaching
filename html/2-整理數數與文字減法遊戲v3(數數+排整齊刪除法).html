<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>整理數數與文字減法遊戲 (單機版)</title>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 React 與 ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- 引入 Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 內建 CSS 樣式與動畫 -->
    <style>
        @keyframes popIn { 0% { transform: scale(0.3); opacity: 0; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        .animate-popIn { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-8px); } }
        .animate-shake { animation: shake 0.4s ease-in-out; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .no-select { user-select: none; -webkit-user-select: none; }
    </style>
</head>
<body class="bg-sky-50 m-0 p-0 font-sans text-gray-800 min-h-screen flex flex-col items-center">
    
    <div id="root" class="w-full h-full flex flex-col items-center"></div>

    <!-- 遊戲主程式 -->
    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef } = React;

        // 擴充預設物件：加入中英文名詞、單位與動作，用於生成雙語文字題
        const DEFAULT_OBJECTS = [
          { type: 'emoji', value: '🍎', name_zh: '蘋果', name_en: 'apples', unit_zh: '顆', action_zh: '吃掉了', action_en: 'were eaten' },
          { type: 'emoji', value: '🐶', name_zh: '小狗', name_en: 'puppies', unit_zh: '隻', action_zh: '跑走了', action_en: 'ran away' },
          { type: 'emoji', value: '🚗', name_zh: '玩具車', name_en: 'toy cars', unit_zh: '輛', action_zh: '弄丟了', action_en: 'were lost' },
          { type: 'emoji', value: '⚽', name_zh: '足球', name_en: 'footballs', unit_zh: '顆', action_zh: '借出了', action_en: 'were lent out' },
          { type: 'emoji', value: '⭐', name_zh: '星星', name_en: 'stars', unit_zh: '顆', action_zh: '被雲遮住了', action_en: 'were covered by clouds' },
          { type: 'emoji', value: '🎈', name_zh: '氣球', name_en: 'balloons', unit_zh: '個', action_zh: '破掉了', action_en: 'popped' }
        ];

        function App() {
          // --- 系統與設定狀態 ---
          const [appMode, setAppMode] = useState('settings'); 
          const [gameMode, setGameMode] = useState('sorting'); // 'sorting', 'counting', 'subtraction', 'word_problem'
          const [isRandomMode, setIsRandomMode] = useState(false);
          const [teacherTarget, setTeacherTarget] = useState(10);
          const [teacherObject, setTeacherObject] = useState(DEFAULT_OBJECTS[0]);
          const [showNumbers, setShowNumbers] = useState(false);
          const [showLargeNumbers, setShowLargeNumbers] = useState(false);
          const [language, setLanguage] = useState('zh'); // 'zh' or 'en'
          const fileInputRef = useRef(null);

          // --- 遊戲內部狀態 ---
          const [activeConfig, setActiveConfig] = useState({ targetCount: 10, object: DEFAULT_OBJECTS[0], mode: 'sorting', showNumbers: false, showLargeNumbers: false });
          const [gameState, setGameState] = useState('playing'); // 'playing', 'input', 'win', 'subtraction_start', 'subtraction_playing'
          const [items, setItems] = useState([]);
          const [time, setTime] = useState(0);
          
          // 減法模式專用狀態
          const [subCount, setSubCount] = useState(0);
          const [crossedOutIds, setCrossedOutIds] = useState(new Set());
          
          // 拖拉相關狀態
          const [selectedId, setSelectedId] = useState(null);
          const [draggingItem, setDraggingItem] = useState(null);
          const [dragPos, setDragPos] = useState({ x: 0, y: 0 });
          
          // 畫筆刪除相關狀態 (左側格子)
          const [isDrawing, setIsDrawing] = useState(false);
          const [drawPaths, setDrawPaths] = useState([]);
          const [currentPath, setCurrentPath] = useState([]);
          
          // 手寫列式相關狀態 (右側列式區)
          const [eqMode, setEqMode] = useState('handwrite'); // 'handwrite', 'show'
          const [isEqDrawing, setIsEqDrawing] = useState(false);
          const [eqDrawPaths, setEqDrawPaths] = useState([]);
          const [eqCurrentPath, setEqCurrentPath] = useState([]);
          const eqRef = useRef(null);
          const eqCurrentPathRef = useRef([]);

          const itemsRef = useRef(items);
          const crossedOutIdsRef = useRef(crossedOutIds);
          const subCountRef = useRef(subCount);
          const currentPathRef = useRef([]);

          const [animatingCells, setAnimatingCells] = useState([]);
          const [userAnswer, setUserAnswer] = useState('');
          const [errorShake, setErrorShake] = useState(false);

          const gridRef = useRef(null);
          const cellRefs = useRef([]);

          // --- 狀態同步 Refs ---
          useEffect(() => {
            itemsRef.current = items;
            crossedOutIdsRef.current = crossedOutIds;
            subCountRef.current = subCount;
          }, [items, crossedOutIds, subCount]);

          // --- 遊戲計時器 ---
          useEffect(() => {
            let timer;
            const isPlayingSorting = appMode === 'game' && activeConfig.mode === 'sorting' && gameState === 'playing';
            const isPlayingCounting = appMode === 'game' && activeConfig.mode === 'counting' && gameState === 'input';
            const isPlayingSubtraction = appMode === 'game' && ['subtraction', 'word_problem'].includes(activeConfig.mode) && gameState === 'subtraction_playing';

            if (isPlayingSorting || isPlayingCounting || isPlayingSubtraction) {
              timer = setInterval(() => setTime((t) => t + 1), 1000);
            }
            return () => clearInterval(timer);
          }, [appMode, gameState, activeConfig.mode]);

          // --- 檢查整理模式是否完成 ---
          useEffect(() => {
            if (appMode === 'game' && activeConfig.mode === 'sorting' && gameState === 'playing' && items.length > 0) {
              const allPlaced = items.every((item) => item.gridIndex !== null);
              if (allPlaced) setGameState('input');
            }
          }, [items, gameState, appMode, activeConfig.mode]);

          // --- 圖片上傳壓縮邏輯 ---
          const handleImageUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
              const img = new Image();
              img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX_SIZE = 100;
                let width = img.width, height = img.height;
                if (width > height && width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } 
                else if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                setTeacherObject({ type: 'image', value: canvas.toDataURL('image/png'), name_zh: '自訂物品', name_en: 'items', unit_zh: '個', action_zh: '拿走了', action_en: 'were taken away' });
              };
              img.src = event.target.result;
            };
            reader.readAsDataURL(file);
          };

          // --- 遊戲控制邏輯 ---
          const startGame = () => {
            let finalCount = parseInt(teacherTarget);
            if (isRandomMode) {
              finalCount = Math.floor(Math.random() * (18 - 5 + 1)) + 5;
            }
            if (isNaN(finalCount) || finalCount < 1) finalCount = 1;
            if (finalCount > 18) finalCount = 18;

            setActiveConfig({ targetCount: finalCount, object: teacherObject, mode: gameMode, showNumbers, showLargeNumbers });
            
            let newItems = [];
            
            if (gameMode === 'sorting') {
              newItems = Array.from({ length: finalCount }).map((_, i) => ({ id: i, x: Math.random() * 75 + 10, y: Math.random() * 75 + 10, gridIndex: null }));
              setGameState('playing');
            } else if (gameMode === 'counting') {
              newItems = Array.from({ length: finalCount }).map((_, i) => ({ id: i, x: 0, y: 0, gridIndex: i }));
              setGameState('input');
            } else if (gameMode === 'subtraction') {
              newItems = Array.from({ length: finalCount }).map((_, i) => ({ id: i, x: 0, y: 0, gridIndex: i }));
              setGameState('subtraction_start'); 
              setSubCount(0);
            } else if (gameMode === 'word_problem') {
              // 文字題模式：預先計算好減去的數量，跳過等待畫面直接開始
              newItems = Array.from({ length: finalCount }).map((_, i) => ({ id: i, x: 0, y: 0, gridIndex: i }));
              const amount = Math.floor(Math.random() * finalCount) + 1;
              setSubCount(amount);
              setGameState('subtraction_playing');
              setEqMode('handwrite'); // 預設為手寫列式
              setEqDrawPaths([]);     // 清空手寫板
            }
            
            setItems(newItems);
            setTime(0);
            setUserAnswer('');
            setErrorShake(false);
            setSelectedId(null);
            setDraggingItem(null);
            
            // 清空所有畫筆與刪除紀錄
            setIsDrawing(false);
            setAnimatingCells([]);
            setCrossedOutIds(new Set());
            crossedOutIdsRef.current = new Set();
            setDrawPaths([]);
            setCurrentPath([]);

            setAppMode('game');
          };

          const backToSettings = () => setAppMode('settings');

          const generateSubtraction = () => {
             const amount = Math.floor(Math.random() * activeConfig.targetCount) + 1;
             setSubCount(amount);
             setCrossedOutIds(new Set());
             crossedOutIdsRef.current = new Set();
             setDrawPaths([]);
             setCurrentPath([]);
             setGameState('subtraction_playing');
          };
          
          const resetDrawing = () => {
             const emptySet = new Set();
             setCrossedOutIds(emptySet);
             crossedOutIdsRef.current = emptySet;
             setDrawPaths([]);
             setCurrentPath([]);
             currentPathRef.current = [];
          };

          // --- 語音播放功能 (文字題專用) ---
          const playWordProblemAudio = () => {
              if (!('speechSynthesis' in window)) {
                  alert("您的瀏覽器不支援語音播放功能喔！ / Your browser does not support text-to-speech!");
                  return;
              }
              
              let text = "";
              let langCode = "";

              if (language === 'zh') {
                  text = `原本有 ${activeConfig.targetCount} ${activeConfig.object.unit_zh}${activeConfig.object.name_zh}，${activeConfig.object.action_zh} ${subCount} ${activeConfig.object.unit_zh}，請問還剩下幾個${activeConfig.object.name_zh}呢？`;
                  langCode = 'zh-HK'; // 廣東話 Cantonese
              } else {
                  text = `There were ${activeConfig.targetCount} ${activeConfig.object.name_en}. ${subCount} ${activeConfig.object.action_en}. How many ${activeConfig.object.name_en} are left?`;
                  langCode = 'en-US'; // 英文 English
              }

              const utterance = new SpeechSynthesisUtterance(text);
              utterance.lang = langCode;
              utterance.rate = 0.85; // 稍微放慢語速適合小朋友聽寫
              window.speechSynthesis.cancel(); // 停止先前的播放
              window.speechSynthesis.speak(utterance);
          };

          // --- 手寫列式區畫筆邏輯 ---
          const handleEqPointerDown = (e) => {
              if (e.button !== 0 && e.pointerType === 'mouse') return;
              setIsEqDrawing(true);
              const rect = eqRef.current.getBoundingClientRect();
              eqCurrentPathRef.current = [{ x: e.clientX - rect.left, y: e.clientY - rect.top }];
              setEqCurrentPath([...eqCurrentPathRef.current]);
              e.target.setPointerCapture(e.pointerId);
          };
          
          const handleEqPointerMove = (e) => {
              if (!isEqDrawing) return;
              const rect = eqRef.current.getBoundingClientRect();
              eqCurrentPathRef.current.push({ x: e.clientX - rect.left, y: e.clientY - rect.top });
              setEqCurrentPath([...eqCurrentPathRef.current]);
          };
          
          const handleEqPointerUp = (e) => {
              if (!isEqDrawing) return;
              setIsEqDrawing(false);
              setEqDrawPaths(prev => [...prev, eqCurrentPathRef.current]);
              eqCurrentPathRef.current = [];
              setEqCurrentPath([]);
              e.target.releasePointerCapture(e.pointerId);
          };

          // --- 數字鍵盤處理 ---
          const handleNumPad = (val) => {
            if (val === 'back') setUserAnswer(prev => prev.slice(0, -1));
            else if (val === 'clear') setUserAnswer('');
            else setUserAnswer(prev => (prev + val).slice(0, 3)); 
          };

          const handleSubmitAnswer = () => {
            let expected = activeConfig.targetCount;
            if (['subtraction', 'word_problem'].includes(activeConfig.mode)) {
                expected = activeConfig.targetCount - subCount;
            }

            if (parseInt(userAnswer) === expected) {
              playSound('success'); 
              setGameState('win');
            } else {
              setErrorShake(true); 
              setTimeout(() => setErrorShake(false), 500);
            }
          };

          // --- 音效與渲染 ---
          const playSound = (type) => {
            try {
              const ctx = new (window.AudioContext || window.webkitAudioContext)();
              const osc = ctx.createOscillator(); const gain = ctx.createGain();
              osc.connect(gain); gain.connect(ctx.destination); const now = ctx.currentTime;
              if (type === 'pop') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(); osc.stop(now + 0.1);
              } else if (type === 'delete') { 
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
                gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(); osc.stop(now + 0.15);
              } else if (type === 'success') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2); osc.frequency.setValueAtTime(1046.50, now + 0.3);
                gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.3, now + 0.05);
                gain.gain.setValueAtTime(0.3, now + 0.3); gain.gain.linearRampToValueAtTime(0, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
              }
            } catch (e) {}
          };

          const renderObject = (objData, isAnimating = false) => {
            if (!objData) return null;
            const baseClass = `select-none filter drop-shadow-md pointer-events-none ${isAnimating ? 'animate-popIn' : ''}`;
            if (objData.type === 'image') return <img src={objData.value} alt="item" className={`w-10 h-10 object-contain ${baseClass}`} draggable="false" />;
            return <div className={`text-3xl sm:text-4xl ${baseClass}`}>{objData.value}</div>;
          };

          const placeItem = (itemId, cellIndex) => {
            playSound('pop');
            setItems((prev) => prev.map((item) => item.id === itemId ? { ...item, gridIndex: cellIndex } : item));
            setAnimatingCells((prev) => [...prev, cellIndex]);
            setTimeout(() => setAnimatingCells((prev) => prev.filter((c) => c !== cellIndex)), 400);
          };

          // --- 左側格子的畫筆刪除邏輯 ---
          const getClientXY = (e) => {
              if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
              if (e.changedTouches && e.changedTouches.length > 0) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
              return { x: e.clientX, y: e.clientY };
          };
          
          const getRelativeXY = (e) => {
              const clientXY = getClientXY(e);
              if (!gridRef.current) return clientXY;
              const rect = gridRef.current.getBoundingClientRect();
              return { x: clientXY.x - rect.left, y: clientXY.y - rect.top, clientX: clientXY.x, clientY: clientXY.y };
          };

          const checkHit = (clientX, clientY) => {
              for (let i = 0; i < 25; i++) {
                  const cell = cellRefs.current[i];
                  if (cell) {
                      const rect = cell.getBoundingClientRect();
                      if (clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom) {
                          const itemInCell = itemsRef.current.find(it => it.gridIndex === i);
                          if (itemInCell && !crossedOutIdsRef.current.has(itemInCell.id)) {
                              playSound('delete');
                              setCrossedOutIds(prev => {
                                  const newSet = new Set(prev);
                                  newSet.add(itemInCell.id);
                                  crossedOutIdsRef.current = newSet;
                                  return newSet;
                              });
                          }
                          break;
                      }
                  }
              }
          };

          const handleStartDraw = (e) => {
              if (!['subtraction', 'word_problem'].includes(activeConfig.mode) || gameState !== 'subtraction_playing') return;
              if (e.button !== 0 && e.type !== 'touchstart') return;

              setIsDrawing(true);
              const pos = getRelativeXY(e);
              currentPathRef.current = [{ x: pos.x, y: pos.y }];
              setCurrentPath([...currentPathRef.current]);
              checkHit(pos.clientX, pos.clientY);

              if (e.type === 'touchstart') document.body.style.overflow = 'hidden';
          };

          useEffect(() => {
              const handleMoveDraw = (e) => {
                  if (!isDrawing) return;
                  const pos = getRelativeXY(e);
                  currentPathRef.current = [...currentPathRef.current, { x: pos.x, y: pos.y }];
                  setCurrentPath([...currentPathRef.current]);
                  checkHit(pos.clientX, pos.clientY);
                  if (e.cancelable) e.preventDefault();
              };

              const handleEndDraw = () => {
                  if (isDrawing) {
                      setIsDrawing(false);
                      setDrawPaths(prev => [...prev, currentPathRef.current]);
                      currentPathRef.current = [];
                      setCurrentPath([]);
                      document.body.style.overflow = 'auto';
                  }
              };

              if (isDrawing) {
                  window.addEventListener('mousemove', handleMoveDraw);
                  window.addEventListener('mouseup', handleEndDraw);
                  window.addEventListener('touchmove', handleMoveDraw, { passive: false });
                  window.addEventListener('touchend', handleEndDraw);
              }

              return () => {
                  window.removeEventListener('mousemove', handleMoveDraw);
                  window.removeEventListener('mouseup', handleEndDraw);
                  window.removeEventListener('touchmove', handleMoveDraw);
                  window.removeEventListener('touchend', handleEndDraw);
              };
          }, [isDrawing]);

          // --- 拖拉與點擊邏輯 ---
          const handlePointerDown = (e, id) => {
            if (['subtraction', 'word_problem'].includes(activeConfig.mode)) return;

            if (e.button !== 0 && e.type !== 'touchstart') return; 
            e.stopPropagation(); 
            
            setSelectedId(id === selectedId ? null : id);
            setDraggingItem(id);
            
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            setDragPos({ x: clientX, y: clientY });

            if (e.type === 'touchstart') document.body.style.overflow = 'hidden';
          };

          useEffect(() => {
            const handlePointerMove = (e) => {
              if (draggingItem === null) return;
              const clientX = e.clientX || (e.touches && e.touches[0].clientX);
              const clientY = e.clientY || (e.touches && e.touches[0].clientY);
              setDragPos({ x: clientX, y: clientY });
            };

            const handlePointerUp = (e) => {
              if (draggingItem !== null) {
                const clientX = e.clientX || (e.changedTouches && e.changedTouches[0].clientX);
                const clientY = e.clientY || (e.changedTouches && e.changedTouches[0].clientY);
                
                let droppedCellIndex = null;
                for (let i = 0; i < 25; i++) {
                  const cell = cellRefs.current[i];
                  if (cell) {
                    const rect = cell.getBoundingClientRect();
                    if (clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom) {
                      droppedCellIndex = i; break;
                    }
                  }
                }

                if (droppedCellIndex !== null && !items.find((i) => i.gridIndex === droppedCellIndex)) {
                  placeItem(draggingItem, droppedCellIndex);
                  setSelectedId(null); 
                }
                setDraggingItem(null);
                document.body.style.overflow = 'auto';
              }
            };

            if (draggingItem !== null) {
              window.addEventListener('mousemove', handlePointerMove);
              window.addEventListener('mouseup', handlePointerUp);
              window.addEventListener('touchmove', handlePointerMove, { passive: false });
              window.addEventListener('touchend', handlePointerUp);
            }

            return () => {
              window.removeEventListener('mousemove', handlePointerMove);
              window.removeEventListener('mouseup', handlePointerUp);
              window.removeEventListener('touchmove', handlePointerMove);
              window.removeEventListener('touchend', handlePointerUp);
            };
          }, [draggingItem, items]);

          const handleClickCell = (index) => {
            if (['subtraction', 'word_problem'].includes(activeConfig.mode)) return; 
            if (selectedId !== null && draggingItem === null && !items.find((i) => i.gridIndex === index)) { 
                placeItem(selectedId, index); 
                setSelectedId(null); 
            }
          };

          // ================= 畫面渲染 =================

          return (
            <div className="flex flex-col items-center p-4 w-full h-full max-w-5xl">

              {/* ===== 設定面板 ===== */}
              {appMode === 'settings' && (
                <div className="bg-white p-6 sm:p-10 rounded-3xl shadow-xl w-full mt-4 animate-popIn">
                  <div className="text-center mb-8">
                    <div className="text-7xl mb-2">🍎</div>
                    <h1 className="text-3xl sm:text-4xl font-bold text-amber-600">多元整理與數數遊戲</h1>
                  </div>

                  {/* 遊戲模式選擇 */}
                  <div className="bg-gray-50 p-5 rounded-2xl border border-gray-200 mb-6">
                      <h3 className="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2">🕹️ 1. 選擇遊戲模式</h3>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <button onClick={() => setGameMode('sorting')} className={`py-4 px-2 rounded-xl font-bold transition-colors flex-1 text-lg ${gameMode === 'sorting' ? 'bg-amber-500 text-white shadow-md' : 'bg-white text-gray-500 border hover:bg-amber-50'}`}>整理 + 數數</button>
                          <button onClick={() => { setGameMode('counting'); setIsRandomMode(true); }} className={`py-4 px-2 rounded-xl font-bold transition-colors flex-1 text-lg ${gameMode === 'counting' ? 'bg-green-500 text-white shadow-md' : 'bg-white text-gray-500 border hover:bg-green-50'}`}>直接數數</button>
                          <button onClick={() => { setGameMode('subtraction'); setIsRandomMode(true); }} className={`py-4 px-2 rounded-xl font-bold transition-colors flex-1 text-lg ${gameMode === 'subtraction' ? 'bg-red-500 text-white shadow-md' : 'bg-white text-gray-500 border hover:bg-red-50'}`}>減法挑戰 (單純數字)</button>
                          <button onClick={() => { setGameMode('word_problem'); setIsRandomMode(true); }} className={`py-4 px-2 rounded-xl font-bold transition-colors flex-1 text-lg ${gameMode === 'word_problem' ? 'bg-purple-500 text-white shadow-md' : 'bg-white text-gray-500 border hover:bg-purple-50'}`}>文字題 (故事減法)</button>
                      </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                      {/* 數量設定 */}
                      <div className="bg-gray-50 p-5 rounded-2xl border border-gray-200">
                          <h3 className="text-lg font-bold text-gray-700 mb-3 flex items-center gap-2">🔢 2. 設定總數量</h3>
                          <div className="flex items-center gap-2 mb-3">
                              <button onClick={() => setIsRandomMode(false)} className={`py-2 rounded-xl font-bold transition-colors flex-1 ${!isRandomMode ? 'bg-sky-500 text-white shadow-md' : 'bg-white text-gray-500 border hover:bg-gray-100'}`}>固定數量</button>
                              <button onClick={() => setIsRandomMode(true)} className={`py-2 rounded-xl font-bold transition-colors flex-1 ${isRandomMode ? 'bg-purple-500 text-white shadow-md' : 'bg-white text-gray-500 border hover:bg-gray-100'}`}>隨機 (5-18)</button>
                          </div>
                          {!isRandomMode && (
                              <div className="flex items-center justify-between bg-white p-3 rounded-xl border border-gray-200 shadow-sm">
                                  <label className="font-bold text-gray-600">指定數量 (1-18)：</label>
                                  <input type="number" min="1" max="18" value={teacherTarget} onChange={(e) => setTeacherTarget(e.target.value)} className="w-20 text-center text-xl p-1 border-2 border-sky-200 rounded-lg outline-none focus:border-sky-500 font-bold text-sky-700"/>
                              </div>
                          )}
                      </div>

                      {/* 物件設定 */}
                      <div className="bg-gray-50 p-5 rounded-2xl border border-gray-200">
                          <h3 className="text-lg font-bold text-gray-700 mb-3 flex items-center justify-between">
                              <span className="flex items-center gap-2">🧸 3. 選擇排版物件</span>
                              <div className="w-10 h-10 flex items-center justify-center bg-white border border-amber-200 rounded-lg shadow-sm">
                                  {renderObject(teacherObject)}
                              </div>
                          </h3>
                          <div className="flex flex-wrap gap-2">
                              {DEFAULT_OBJECTS.map((obj, idx) => (
                                  <button key={idx} onClick={() => setTeacherObject(obj)}
                                      className={`text-2xl w-12 h-12 flex items-center justify-center rounded-xl transition-transform hover:scale-110 
                                      ${teacherObject.value === obj.value ? 'bg-amber-200 shadow-inner ring-2 ring-amber-400' : 'bg-white shadow-sm border border-gray-200'}`}
                                  >
                                      {obj.value}
                                  </button>
                              ))}
                              <div className="relative">
                                  <input type="file" accept="image/*" ref={fileInputRef} onChange={handleImageUpload} className="hidden" />
                                  <button onClick={() => fileInputRef.current.click()}
                                      className={`h-12 px-3 flex items-center justify-center gap-1 rounded-xl font-bold text-sm transition-transform hover:scale-105
                                      ${teacherObject.type === 'image' ? 'bg-amber-200 text-amber-800 ring-2 ring-amber-400' : 'bg-white text-gray-600 shadow-sm border border-gray-200'}`}
                                  >
                                      🖼️ 上傳
                                  </button>
                              </div>
                          </div>
                      </div>
                      
                      {/* 輔助功能設定 */}
                      <div className="bg-gray-50 p-5 rounded-2xl border border-gray-200 md:col-span-2">
                          <h3 className="text-lg font-bold text-gray-700 mb-3 flex items-center gap-2">💡 4. 輔助功能 (數字標籤)</h3>
                          <div className="flex flex-col sm:flex-row gap-3">
                              <label className="flex items-center gap-3 cursor-pointer bg-white p-3 rounded-xl border border-gray-200 shadow-sm hover:bg-gray-50 transition-colors flex-1">
                                  <input type="checkbox" checked={showNumbers} onChange={(e) => setShowNumbers(e.target.checked)} className="w-5 h-5 accent-sky-500 cursor-pointer" />
                                  <span className="font-bold text-gray-700">顯示左上角小數字</span>
                              </label>
                              <label className="flex items-center gap-3 cursor-pointer bg-white p-3 rounded-xl border border-gray-200 shadow-sm hover:bg-gray-50 transition-colors flex-1">
                                  <input type="checkbox" checked={showLargeNumbers} onChange={(e) => setShowLargeNumbers(e.target.checked)} className="w-5 h-5 accent-sky-500 cursor-pointer" />
                                  <span className="font-bold text-gray-700">顯示正中央大數字</span>
                              </label>
                          </div>
                      </div>
                  </div>

                  <button onClick={startGame} className="w-full py-5 bg-sky-500 hover:bg-sky-600 text-white text-2xl font-bold rounded-2xl shadow-lg transition-transform active:scale-95 flex justify-center items-center gap-2">
                    🚀 開始遊戲
                  </button>
                </div>
              )}

              {/* ===== 遊戲畫面 ===== */}
              {appMode === 'game' && (
                <div className="w-full flex flex-col items-center no-select pb-10">
                  
                  {/* 控制列 */}
                  <div className="w-full flex flex-col lg:flex-row justify-between items-center mb-6 bg-white px-4 sm:px-6 py-3 rounded-2xl shadow-sm gap-4">
                    <h1 className="text-xl sm:text-2xl font-bold text-amber-600 flex items-center gap-2">
                       🎯 整理小幫手 
                    </h1>
                    <div className="flex flex-wrap gap-2 sm:gap-4 items-center justify-center">
                        {activeConfig.mode === 'word_problem' && (
                            <button onClick={() => setLanguage(l => l === 'zh' ? 'en' : 'zh')} className="px-3 py-1 bg-indigo-100 hover:bg-indigo-200 rounded-lg font-bold text-indigo-700 transition-colors shadow-sm text-sm border-2 border-indigo-200">
                                {language === 'zh' ? '🔤 轉英文' : '🀄 轉中文'}
                            </button>
                        )}
                        <div className="flex gap-2">
                            <label className="flex items-center gap-1 cursor-pointer bg-sky-50 px-2 py-1 rounded-lg border border-sky-200 hover:bg-sky-100 transition-colors shadow-sm">
                                <input type="checkbox" checked={showNumbers} onChange={(e) => setShowNumbers(e.target.checked)} className="w-4 h-4 accent-sky-500 cursor-pointer" />
                                <span className="font-bold text-sky-700 text-sm">小數字</span>
                            </label>
                            <label className="flex items-center gap-1 cursor-pointer bg-sky-50 px-2 py-1 rounded-lg border border-sky-200 hover:bg-sky-100 transition-colors shadow-sm">
                                <input type="checkbox" checked={showLargeNumbers} onChange={(e) => setShowLargeNumbers(e.target.checked)} className="w-4 h-4 accent-sky-500 cursor-pointer" />
                                <span className="font-bold text-sky-700 text-sm">大數字</span>
                            </label>
                        </div>
                        <div className="text-lg font-bold text-sky-600 bg-sky-100 px-3 py-1 rounded-lg shadow-sm">計時：{time} 秒</div>
                        <button onClick={startGame} className="px-3 py-1 bg-amber-100 hover:bg-amber-200 rounded-lg font-bold text-amber-700 transition-colors shadow-sm text-sm">⏭️ 下一題</button>
                        <button onClick={backToSettings} className="px-3 py-1 bg-gray-200 hover:bg-gray-300 rounded-lg font-bold text-gray-700 transition-colors shadow-sm text-sm">返回</button>
                    </div>
                  </div>

                  {/* --- 文字題專屬置頂大型橫幅 --- */}
                  {activeConfig.mode === 'word_problem' && (
                    <div className="w-full max-w-4xl bg-purple-100 border-4 border-purple-300 rounded-2xl p-4 sm:p-6 mb-6 shadow-md flex flex-col sm:flex-row items-center justify-center gap-4 sm:gap-8 animate-popIn">
                        <div className="text-2xl sm:text-3xl lg:text-4xl font-bold text-gray-800 leading-snug text-center sm:text-left flex-1">
                            {language === 'zh' ? (
                                <>
                                    原本有 <strong className="text-sky-600 mx-1">{activeConfig.targetCount}</strong> {activeConfig.object.unit_zh}{activeConfig.object.name_zh}，
                                    <span className="inline-block sm:block mt-2">
                                        {activeConfig.object.action_zh} <strong className="text-red-600 underline mx-1">{subCount}</strong> {activeConfig.object.unit_zh}，
                                    </span>
                                    <span className="inline-block sm:block mt-2">請問還剩下幾個{activeConfig.object.name_zh}呢？</span>
                                </>
                            ) : (
                                <>
                                    There were <strong className="text-sky-600 mx-1">{activeConfig.targetCount}</strong> {activeConfig.object.name_en}.
                                    <span className="inline-block sm:block mt-2">
                                        <strong className="text-red-600 underline mx-1">{subCount}</strong> {activeConfig.object.action_en}.
                                    </span>
                                    <span className="inline-block sm:block mt-2">How many {activeConfig.object.name_en} are left?</span>
                                </>
                            )}
                        </div>
                        <button onClick={playWordProblemAudio} className="shrink-0 w-20 h-20 sm:w-24 sm:h-24 bg-purple-500 hover:bg-purple-600 text-white rounded-full flex items-center justify-center text-4xl sm:text-5xl shadow-xl transition-transform active:scale-95 border-4 border-white">
                            🔊
                        </button>
                    </div>
                  )}

                  <div className="flex flex-col md:flex-row w-full gap-8 justify-center items-start">
                    
                    {/* --- 左側：5x5 表格 --- */}
                    <div className="w-full md:w-1/2 flex flex-col items-center">
                      <h2 className="text-xl font-bold text-gray-700 mb-4 bg-white/50 px-4 py-1 rounded-full pointer-events-none">
                        {['subtraction', 'word_problem'].includes(activeConfig.mode) ? '左側：請在這裡劃掉物品' : 
                         activeConfig.mode === 'counting' ? '左側：整齊的物品' : '左側：排放整齊'}
                      </h2>
                      <div 
                        ref={gridRef}
                        onMouseDown={handleStartDraw}
                        onTouchStart={handleStartDraw}
                        className={`grid grid-cols-5 grid-rows-5 gap-1 sm:gap-2 w-[320px] h-[320px] sm:w-[400px] sm:h-[400px] shrink-0 p-2 sm:p-3 bg-amber-100 rounded-2xl shadow-inner border-4 transition-colors relative
                          ${['subtraction', 'word_problem'].includes(activeConfig.mode) && gameState === 'subtraction_playing' ? 'cursor-crosshair border-red-400 ring-4 ring-red-200' : 'border-amber-200'}
                        `}
                      >
                        {Array.from({ length: 25 }).map((_, i) => {
                          const itemInCell = items.find((item) => item.gridIndex === i);
                          const isAnimating = animatingCells.includes(i);
                          const isCrossedOut = itemInCell ? crossedOutIds.has(itemInCell.id) : false;
                          
                          let seqNum = null;
                          if (itemInCell && (showNumbers || showLargeNumbers)) {
                            const placedSorted = items.filter(it => it.gridIndex !== null).sort((a, b) => a.gridIndex - b.gridIndex);
                            seqNum = placedSorted.findIndex(it => it.id === itemInCell.id) + 1;
                          }
                          
                          return (
                            <div 
                              key={i} 
                              ref={el => cellRefs.current[i] = el}
                              onClick={() => handleClickCell(i)} 
                              className={`w-full h-full bg-white rounded-xl shadow-sm flex items-center justify-center relative transition-colors overflow-hidden
                                ${selectedId !== null && !itemInCell && !['subtraction', 'word_problem'].includes(activeConfig.mode) ? 'ring-2 ring-amber-300 ring-inset cursor-pointer hover:bg-amber-50' : ''}
                              `}
                            >
                              {itemInCell && (
                                <div 
                                  onMouseDown={(e) => handlePointerDown(e, itemInCell.id)}
                                  onTouchStart={(e) => handlePointerDown(e, itemInCell.id)}
                                  className={`w-full h-full flex items-center justify-center touch-none relative transition-all duration-300
                                    ${draggingItem === itemInCell.id ? 'opacity-0' : ''}
                                    ${!['subtraction', 'word_problem'].includes(activeConfig.mode) && !draggingItem ? 'cursor-grab active:cursor-grabbing hover:scale-110' : ''}
                                    ${selectedId === itemInCell.id && draggingItem !== itemInCell.id ? 'scale-125 ring-4 ring-yellow-400 rounded-full bg-yellow-100/80 z-10 p-1' : ''}
                                    ${isCrossedOut ? 'opacity-40 grayscale scale-95' : ''}
                                  `}
                                >
                                  {renderObject(activeConfig.object, isAnimating)}
                                  
                                  {seqNum !== null && showNumbers && (
                                    <div className="absolute top-0 left-0 sm:top-1 sm:left-1 bg-sky-500 text-white font-black rounded-full w-5 h-5 sm:w-6 sm:h-6 flex items-center justify-center text-xs sm:text-sm shadow-md z-20 pointer-events-none">
                                      {seqNum}
                                    </div>
                                  )}
                                  {seqNum !== null && showLargeNumbers && (
                                    <div className="absolute inset-0 flex items-center justify-center z-30 pointer-events-none">
                                      <span className="text-4xl sm:text-5xl font-black text-white" style={{ textShadow: '0 0 6px #000, 0 0 10px #000, 0 0 15px #000' }}>
                                        {seqNum}
                                      </span>
                                    </div>
                                  )}
                                </div>
                              )}
                            </div>
                          );
                        })}

                        {/* --- 畫筆 SVG 疊層 --- */}
                        {['subtraction', 'word_problem'].includes(activeConfig.mode) && (
                            <svg className="absolute inset-0 w-full h-full pointer-events-none z-40">
                                {drawPaths.map((path, idx) => (
                                    <polyline
                                        key={idx}
                                        points={path.map(p => `${p.x},${p.y}`).join(' ')}
                                        fill="none"
                                        stroke="rgba(239, 68, 68, 0.9)"
                                        strokeWidth="10"
                                        strokeLinecap="round"
                                        strokeLinejoin="round"
                                        style={{ filter: 'drop-shadow(0 2px 4px rgba(0,0,0,0.3))' }}
                                    />
                                ))}
                                {currentPath.length > 1 && (
                                    <polyline
                                        points={currentPath.map(p => `${p.x},${p.y}`).join(' ')}
                                        fill="none"
                                        stroke="rgba(239, 68, 68, 0.9)"
                                        strokeWidth="10"
                                        strokeLinecap="round"
                                        strokeLinejoin="round"
                                        style={{ filter: 'drop-shadow(0 2px 4px rgba(0,0,0,0.3))' }}
                                    />
                                )}
                            </svg>
                        )}
                      </div>
                    </div>

                    {/* --- 右側：動態區域 --- */}
                    <div className="w-full md:w-1/2 flex flex-col items-center justify-center">
                      
                      {/* 1. 整理模式 */}
                      {activeConfig.mode === 'sorting' && gameState === 'playing' && (
                        <>
                          <h2 className="text-xl font-bold text-gray-700 mb-4 bg-white/50 px-4 py-1 rounded-full pointer-events-none">右側：混亂的物品</h2>
                          <div className="w-[320px] h-[320px] sm:w-[400px] sm:h-[400px] shrink-0 relative bg-green-50 rounded-2xl border-4 border-dashed border-green-400 p-4 overflow-hidden shadow-inner touch-none">
                            {items.filter((item) => item.gridIndex === null).map((item) => (
                              <div 
                                key={item.id} 
                                onMouseDown={(e) => handlePointerDown(e, item.id)}
                                onTouchStart={(e) => handlePointerDown(e, item.id)}
                                style={{ left: draggingItem !== item.id ? `${item.x}%` : undefined, top: draggingItem !== item.id ? `${item.y}%` : undefined }}
                                className={`absolute flex items-center justify-center touch-none
                                  ${draggingItem === item.id ? 'opacity-0' : 'cursor-grab active:cursor-grabbing hover:scale-110 transition-transform'}
                                  ${selectedId === item.id && draggingItem !== item.id ? 'scale-125 ring-4 ring-yellow-400 rounded-full bg-yellow-100/80 z-10 p-1' : ''}
                                `}
                              >
                                 {renderObject(activeConfig.object)}
                              </div>
                            ))}
                          </div>
                        </>
                      )}

                      {/* 2. 減法模式：等待產生題目 (僅單純數字減法才顯示等待畫面) */}
                      {activeConfig.mode === 'subtraction' && gameState === 'subtraction_start' && (
                        <div className="bg-white rounded-3xl p-8 max-w-[400px] w-full text-center shadow-xl border-4 border-red-100 animate-popIn mt-2">
                           <div className="text-6xl mb-4 pointer-events-none">🎲</div>
                           <h2 className="text-3xl font-bold text-red-600 mb-4">減法挑戰！</h2>
                           <p className="text-xl text-gray-600 mb-6 font-bold">
                             左邊總共有 <span className="text-3xl text-sky-600 mx-1">{activeConfig.targetCount}</span> 個。
                           </p>
                           <button onClick={generateSubtraction} className={`w-full py-5 hover:opacity-90 text-white text-2xl font-bold rounded-2xl shadow-lg transition-transform active:scale-95 bg-red-500`}>
                             點擊隨機決定減去幾個
                           </button>
                        </div>
                      )}

                      {/* 4. 統一的答題輸入區 */}
                      {(gameState === 'input' || gameState === 'subtraction_playing') && (
                        <div className={`bg-white rounded-3xl p-4 sm:p-6 max-w-[360px] w-full text-center shadow-xl border-4 animate-popIn mt-2
                           ${['subtraction', 'word_problem'].includes(activeConfig.mode) ? 'border-red-100' : 'border-sky-100'}`}>
                          
                          {/* 依模式變換標題 */}
                          {activeConfig.mode === 'sorting' && <h2 className="text-2xl font-bold text-sky-600 mb-2">✨ 整理完成！</h2>}
                          {activeConfig.mode === 'counting' && <h2 className="text-2xl font-bold text-green-600 mb-2">👀 直接數數！</h2>}
                          {activeConfig.mode === 'subtraction' && <h2 className="text-2xl font-bold text-red-600 mb-2">🖍️ 劃掉與作答</h2>}
                          {activeConfig.mode === 'word_problem' && <h2 className="text-2xl font-bold text-purple-600 mb-2">📖 聽故事算數學</h2>}

                          {/* 題目提示 / 文字題區 / 列式區 */}
                          {activeConfig.mode === 'subtraction' ? (
                              <div className="flex flex-col items-center gap-2 mb-3">
                                  <p className="text-gray-700 font-bold text-sm">請用畫筆劃掉指定的數量，並輸入剩下的數字。</p>
                                  <div className="text-2xl font-bold text-gray-800 bg-red-50 px-4 py-2 rounded-xl border border-red-200">
                                    {activeConfig.targetCount} <span className="text-red-500 mx-1">-</span> <span className="text-red-600 underline">{subCount}</span> = ?
                                  </div>
                              </div>
                          ) : activeConfig.mode === 'word_problem' ? (
                              <div className="mb-4 w-full">
                                  {/* 列式區的純文字紀錄 */}
                                  <div className="text-left bg-purple-50 p-3 sm:p-4 rounded-xl border border-purple-200 shadow-sm leading-relaxed text-gray-700 font-medium text-sm sm:text-base mb-3">
                                      {language === 'zh' ? (
                                          <>
                                              原本有 <strong className="text-lg text-sky-600">{activeConfig.targetCount}</strong> {activeConfig.object.unit_zh}{activeConfig.object.name_zh}，<br/>
                                              {activeConfig.object.action_zh} <strong className="text-lg text-red-600 underline">{subCount}</strong> {activeConfig.object.unit_zh}，<br/>
                                              請問還剩下幾個{activeConfig.object.name_zh}呢？
                                          </>
                                      ) : (
                                          <>
                                              There were <strong className="text-lg text-sky-600">{activeConfig.targetCount}</strong> {activeConfig.object.name_en}.<br/>
                                              <strong className="text-lg text-red-600 underline">{subCount}</strong> {activeConfig.object.action_en}.<br/>
                                              How many {activeConfig.object.name_en} are left?
                                          </>
                                      )}
                                  </div>
                                  
                                  {/* 列式區 (文字題大字已移至上方，這裡只保留列式板) */}
                                  <div className="bg-white border-2 border-purple-200 rounded-xl overflow-hidden shadow-sm flex flex-col">
                                      <div className="flex bg-purple-50 border-b border-purple-200">
                                          <button onClick={() => setEqMode('handwrite')} className={`flex-1 py-1.5 text-sm font-bold transition-colors ${eqMode === 'handwrite' ? 'bg-purple-200 text-purple-800' : 'text-gray-500 hover:bg-purple-100'}`}>✍️ 手寫列式</button>
                                          <button onClick={() => setEqMode('show')} className={`flex-1 py-1.5 text-sm font-bold transition-colors border-l border-purple-200 ${eqMode === 'show' ? 'bg-purple-200 text-purple-800' : 'text-gray-500 hover:bg-purple-100'}`}>👁️ 顯示列式</button>
                                      </div>
                                      
                                      <div className="h-20 sm:h-24 relative flex items-center justify-center bg-gray-50">
                                          {eqMode === 'show' ? (
                                              <div className="text-2xl sm:text-3xl font-black text-gray-700 tracking-wider">
                                                  {activeConfig.targetCount} - {subCount} = ?
                                              </div>
                                          ) : (
                                              <>
                                                  {/* 手寫畫布 */}
                                                  <svg 
                                                      ref={eqRef}
                                                      onPointerDown={handleEqPointerDown}
                                                      onPointerMove={handleEqPointerMove}
                                                      onPointerUp={handleEqPointerUp}
                                                      onPointerLeave={handleEqPointerUp}
                                                      className="absolute inset-0 w-full h-full touch-none cursor-crosshair"
                                                  >
                                                      {eqDrawPaths.map((path, idx) => (
                                                          <polyline key={idx} points={path.map(p => `${p.x},${p.y}`).join(' ')} fill="none" stroke="#6b21a8" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" />
                                                      ))}
                                                      {eqCurrentPath.length > 0 && (
                                                          <polyline points={eqCurrentPath.map(p => `${p.x},${p.y}`).join(' ')} fill="none" stroke="#6b21a8" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" />
                                                      )}
                                                  </svg>
                                                  {/* 清除按鈕 */}
                                                  <button onClick={() => setEqDrawPaths([])} className="absolute bottom-1 right-1 bg-white border border-gray-300 text-gray-500 text-xs px-2 py-1 rounded shadow-sm hover:bg-gray-100 active:scale-95 z-10">
                                                      清除
                                                  </button>
                                              </>
                                          )}
                                      </div>
                                  </div>
                              </div>
                          ) : (
                              <p className="text-gray-600 font-bold mb-2">總共有幾個呢？</p>
                          )}
                          
                          {/* 顯示輸入的值 */}
                          <div className={`w-full h-12 sm:h-14 flex items-center justify-center text-4xl font-black rounded-xl border-4 mb-3 transition-colors
                             ${errorShake ? 'border-red-400 bg-red-50 text-red-600 animate-shake' : 
                               ['subtraction', 'word_problem'].includes(activeConfig.mode) ? 'border-red-200 bg-red-50 text-red-800' : 'border-sky-200 bg-sky-50 text-sky-800'}
                          `}>
                             {userAnswer || <span className="text-gray-300 text-2xl">請輸入答案</span>}
                          </div>

                          {/* 大型數字鍵盤 */}
                          <div className="grid grid-cols-3 gap-1.5 sm:gap-2 mb-3">
                              {[1, 2, 3, 4, 5, 6, 7, 8, 9].map((num) => (
                                  <button key={num} onClick={() => handleNumPad(num.toString())}
                                      className={`py-2 text-xl font-bold rounded-lg shadow-sm transition-transform active:scale-95
                                      ${['subtraction', 'word_problem'].includes(activeConfig.mode) ? 'bg-red-50 hover:bg-red-100 text-red-800' : 'bg-sky-100 hover:bg-sky-200 text-sky-800'}`}>
                                      {num}
                                  </button>
                              ))}
                              <button onClick={() => handleNumPad('clear')} className="py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 text-sm font-bold rounded-lg shadow-sm transition-transform active:scale-95">
                                  清除
                              </button>
                              <button onClick={() => handleNumPad('0')} className={`py-2 text-xl font-bold rounded-lg shadow-sm transition-transform active:scale-95
                                  ${['subtraction', 'word_problem'].includes(activeConfig.mode) ? 'bg-red-50 hover:bg-red-100 text-red-800' : 'bg-sky-100 hover:bg-sky-200 text-sky-800'}`}>
                                  0
                              </button>
                              <button onClick={() => handleNumPad('back')} className="py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 text-base font-bold rounded-lg shadow-sm transition-transform active:scale-95">
                                  ⌫
                              </button>
                          </div>

                          <div className="flex gap-2">
                              {['subtraction', 'word_problem'].includes(activeConfig.mode) && (
                                  <button onClick={resetDrawing} className="w-1/3 py-2 sm:py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm sm:text-base font-bold rounded-xl shadow-md transition-transform active:scale-95 flex items-center justify-center gap-1">
                                    <span>🧹</span> <span className="hidden sm:inline">還原物品</span>
                                  </button>
                              )}
                              <button onClick={handleSubmitAnswer} disabled={!userAnswer} className={`flex-1 py-2 sm:py-3 text-white text-lg font-bold rounded-xl shadow-md transition-transform active:scale-95
                                ${!userAnswer ? 'bg-gray-300' : 'bg-green-500 hover:bg-green-600'}`}>
                                ✅ 提交答案
                              </button>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}
              
              {/* --- 獨立渲染正在被拖拉的物件 --- */}
              {draggingItem !== null && (
                 <div 
                   className="fixed pointer-events-none z-50 scale-125 ring-4 ring-yellow-400 rounded-full bg-yellow-100/80 p-1 flex items-center justify-center drop-shadow-2xl"
                   style={{ left: dragPos.x, top: dragPos.y, transform: 'translate(-50%, -50%)' }}
                 >
                   {renderObject(activeConfig.object)}
                 </div>
              )}

              {/* ===== 勝利結算畫面 ===== */}
              {appMode === 'game' && gameState === 'win' && (
                <div className="fixed inset-0 bg-green-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                  <div className="bg-white rounded-3xl p-10 max-w-md w-full text-center shadow-2xl animate-popIn">
                    <div className="text-7xl mb-6 flex justify-center pointer-events-none">{renderObject(activeConfig.object)}</div>
                    
                    <h2 className="text-4xl font-bold text-green-600 mb-2 pointer-events-none">太棒了！</h2>
                    
                    {/* 結算公式顯示 */}
                    {['subtraction', 'word_problem'].includes(activeConfig.mode) && (
                        <div className="text-3xl font-black text-gray-700 my-4 bg-green-50 p-3 rounded-xl border border-green-200 inline-block">
                           {activeConfig.targetCount} - {subCount} = {activeConfig.targetCount - subCount}
                        </div>
                    )}
                    
                    <p className="text-xl text-gray-700 mb-8 pointer-events-none">
                      花了 <strong className="text-sky-500">{time}</strong> 秒完成！
                    </p>

                    <div className="flex flex-col gap-3">
                        <button onClick={startGame} className="w-full py-4 bg-green-500 hover:bg-green-600 text-white text-xl font-bold rounded-xl shadow transition-transform active:scale-95">
                            再來一局
                        </button>
                        <button onClick={backToSettings} className="w-full py-3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold rounded-xl shadow transition-transform active:scale-95">
                            返回設定
                        </button>
                    </div>
                  </div>
                </div>
              )}

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
