<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數數樂 - 互動加法學習工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            background-color: #f0fdf4; /* Light green background */
        }
        
        /* Ceramic Plate Styling */
        .plate-container {
            min-height: 250px;
            background: radial-gradient(circle at center, #ffffff 0%, #f8fafc 70%, #e2e8f0 100%);
            border: 10px solid #cbd5e1;
            border-radius: 2.5rem;
            position: relative;
            box-shadow: inset 0 10px 20px rgba(0, 0, 0, 0.08), 0 10px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            padding: 1.5rem;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }

        .plate-container.highlight {
            border-color: #22c55e;
            background-color: #f0fdf4;
        }

        .item-icon {
            font-size: 2.5rem;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            cursor: grab;
            transition: transform 0.2s;
            user-select: none;
            touch-action: none;
        }

        .item-icon:hover {
            transform: scale(1.1);
        }

        .dragging {
            opacity: 0.9;
            transform: scale(1.1) !important;
            pointer-events: none; /* Let mouse events pass through to plate below */
            cursor: grabbing !important;
            box-shadow: 0 15px 25px rgba(0,0,0,0.2);
            transition: none !important;
        }

        .item-moving {
            position: absolute;
            z-index: 50;
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        
        /* Bundle representation for large numbers */
        .item-bundle {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(255, 255, 255, 0.95);
            border: 3px solid #94a3b8;
            border-radius: 0.75rem;
            padding: 0.5rem 1rem;
            font-weight: bold;
            font-size: 1.25rem;
            color: #334155;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            cursor: grab;
            touch-action: none;
            user-select: none;
        }
        
        .item-bundle .bundle-icon {
            margin-right: 0.5rem;
            font-size: 2rem;
        }

        .celebrate {
            animation: bounce 1s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(-25%); animation-timing-function: cubic-bezier(0.8, 0, 1, 1); }
            50% { transform: translateY(0); animation-timing-function: cubic-bezier(0, 0, 0.2, 1); }
        }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">

    <!-- Header / Settings Area -->
    <header class="bg-white shadow-sm p-4 z-10">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold text-green-600 flex items-center gap-2">
                <i class="fa-solid fa-utensils"></i> 數數樂
            </h1>
            
            <div class="flex flex-wrap items-center gap-4 text-sm">
                <!-- Level Selection -->
                <div class="flex items-center gap-2 bg-gray-100 p-2 rounded-lg">
                    <label class="font-semibold text-gray-700">程度:</label>
                    <select id="levelSelect" class="bg-white border border-gray-300 text-gray-900 rounded-md py-1 px-2 focus:ring-green-500 focus:border-green-500">
                        <option value="1">程度一: 從零開始 (由空碟加起)</option>
                        <option value="2">程度二: 繼續數 (原有數量再加)</option>
                    </select>
                </div>

                <!-- Range Selection -->
                <div class="flex items-center gap-2 bg-gray-100 p-2 rounded-lg">
                    <label class="font-semibold text-gray-700">數量範圍:</label>
                    <select id="rangeSelect" class="bg-white border border-gray-300 text-gray-900 rounded-md py-1 px-2 focus:ring-green-500 focus:border-green-500">
                        <option value="5">5以內</option>
                        <option value="10" selected>10以內</option>
                        <option value="50">50以內 (每5個一組)</option>
                        <option value="100">100以內 (每10個一組)</option>
                        <option value="300">300以內 (每50個一組)</option>
                    </select>
                </div>

                <!-- Theme Selection -->
                <div class="flex items-center gap-2 bg-gray-100 p-2 rounded-lg">
                    <label class="font-semibold text-gray-700">主題:</label>
                    <select id="themeSelect" class="bg-white border border-gray-300 text-gray-900 rounded-md py-1 px-2 focus:ring-green-500 focus:border-green-500">
                        <option value="apple">🍎 蘋果</option>
                        <option value="star">⭐ 星星</option>
                        <option value="candy">🍬 糖果</option>
                        <option value="cat">🐱 貓咪 (動漫風)</option>
                        <option value="robot">🤖 機械人</option>
                    </select>
                </div>

                <!-- Answer Mode Selection -->
                <div class="flex items-center gap-2 bg-gray-100 p-2 rounded-lg">
                    <label class="font-semibold text-gray-700">答題方式:</label>
                    <select id="inputModeSelect" class="bg-white border border-gray-300 text-gray-900 rounded-md py-1 px-2 focus:ring-green-500 focus:border-green-500 font-bold text-green-700">
                        <option value="handwriting" selected>✍️ 手寫寫字</option>
                        <option value="keyboard">⌨️ 鍵盤輸入</option>
                    </select>
                </div>
                
                <!-- Voice Toggle -->
                 <div class="flex items-center gap-2 bg-gray-100 p-2 rounded-lg">
                    <label class="inline-flex items-center cursor-pointer">
                      <input type="checkbox" id="voiceToggle" class="sr-only peer" checked>
                      <div class="relative w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-green-300 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-600"></div>
                      <span class="ms-3 text-sm font-medium text-gray-700">🗣️ 廣東話語音 (只數數字)</span>
                    </label>
                </div>
                
                <!-- Show Total Toggle (Level 1) -->
                 <div id="showTotalToggleContainer" class="flex items-center gap-2 bg-gray-100 p-2 rounded-lg">
                    <label class="inline-flex items-center cursor-pointer">
                      <input type="checkbox" id="showTotalToggle" class="sr-only peer" checked>
                      <div class="relative w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-green-300 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-600"></div>
                      <span class="ms-3 text-sm font-medium text-gray-700">顯示累積數量</span>
                    </label>
                </div>
            </div>
            
            <button id="newGameBtn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg shadow transition-colors whitespace-nowrap">
                <i class="fa-solid fa-rotate-right"></i> 新題目
            </button>
        </div>
    </header>

    <!-- Main Game Area -->
    <main class="flex-grow flex flex-col md:flex-row p-4 gap-6 max-w-6xl mx-auto w-full overflow-y-auto">
        
        <!-- Left Side: Interactive Area -->
        <div class="flex-grow flex flex-col gap-4 w-full md:w-2/3">

            <!-- Two Plates Container (Symmetrical Equal Dimensions) -->
            <div class="flex-grow flex flex-col sm:flex-row gap-4 items-stretch justify-center relative">
                
                <!-- Source Plate (Left) -->
                <div class="flex-1 flex flex-col relative min-h-[260px]">
                    <h3 class="text-center font-bold mb-2 text-gray-600 text-xl flex justify-center items-center px-4 h-8">
                    </h3>
                    <div class="px-2 pb-2 flex-grow flex flex-col relative">
                        <div id="sourceBasket" class="plate-container flex-grow" aria-label="來源碟仔">
                            <!-- Items will be injected here -->
                        </div>
                    </div>
                    <div id="moveAllBtn" class="absolute bottom-6 left-1/2 transform -translate-x-1/2 bg-blue-100 text-blue-700 px-6 py-3 rounded-full font-bold shadow-md cursor-pointer hover:bg-blue-200 transition hidden text-base whitespace-nowrap z-20">
                        全部搬過去 <i class="fa-solid fa-arrow-right"></i>
                    </div>
                </div>

                <!-- Arrow indicator -->
                <div class="hidden sm:flex flex-col justify-center items-center">
                    <i class="fa-solid fa-arrow-right-long text-5xl text-green-300 animate-pulse"></i>
                </div>

                <!-- Destination Plate (Right) -->
                <div class="flex-1 flex flex-col min-h-[260px]">
                    <h3 class="text-center font-bold mb-2 text-gray-600 text-xl flex justify-end items-center px-4 h-8">
                        <span id="destCountBadge" class="bg-green-100 text-green-800 py-1 px-4 rounded-full text-2xl font-bold transition-all duration-300 shadow-inner">0</span>
                    </h3>
                    <!-- For Level 2, show initial count clearly -->
                    <div id="initialCountDisplay" class="text-center text-lg text-gray-600 mb-2 hidden">
                        原本有: <span id="initialCountNum" class="font-bold text-2xl text-blue-600">0</span>
                    </div>
                    <div class="px-2 pb-2 flex-grow flex flex-col relative">
                        <div id="destBasket" class="plate-container flex-grow" aria-label="目標碟仔">
                            <!-- Items will be injected here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side: Answer Panel -->
        <div class="w-full md:w-1/3 flex flex-col gap-4">
            <div class="bg-white p-6 rounded-3xl shadow-lg border border-gray-100 flex-grow flex flex-col">
                
                <div class="flex-grow flex flex-col justify-between gap-3 pt-1">
                    <div class="text-center flex-grow flex flex-col">
                        <label class="block text-2xl font-bold text-green-700 mb-2">總共有幾多個？</label>

                        <!-- Handwriting Canvas Area (Default) -->
                        <div id="handwritingContainer" class="flex flex-col items-center w-full flex-grow justify-between">
                            <div class="relative w-full flex-grow min-h-[280px] sm:min-h-[340px] border-4 border-dashed border-green-300 rounded-2xl bg-slate-50 shadow-inner flex justify-center items-center overflow-hidden">
                                <canvas id="hwCanvas" class="touch-none cursor-crosshair w-full h-full block"></canvas>
                                <span id="hwPlaceholder" class="absolute text-gray-300 pointer-events-none text-2xl font-bold">在黑板寫答案...</span>
                            </div>
                            <div class="flex gap-2 mt-2 w-full justify-center">
                                <button id="clearHwBtn" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg text-sm font-bold transition">
                                    <i class="fa-solid fa-eraser mr-1"></i> 清除重新寫
                                </button>
                            </div>
                        </div>

                        <!-- Keyboard Input Area (Hidden by default) -->
                        <div id="keyboardContainer" class="hidden mt-2 my-auto">
                            <input type="number" id="answerInput" class="w-full text-center text-5xl font-bold p-4 border-4 border-gray-200 rounded-2xl focus:ring-4 focus:ring-green-200 focus:border-green-500 transition-all outline-none" placeholder="?">
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button id="submitBtn" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-2xl text-2xl shadow-xl transition-transform transform hover:-translate-y-1 active:translate-y-0 mt-1">
                        <i class="fa-solid fa-check-circle mr-2"></i> 提交答案
                    </button>
                    
                    <!-- Feedback Area -->
                    <div id="feedbackArea" class="hidden text-center p-3 rounded-xl font-bold text-base">
                        <!-- Feedback content -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal for Result -->
    <div id="resultModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white p-10 rounded-3xl shadow-2xl max-w-lg w-full text-center transform scale-95 transition-transform duration-300 ease-out">
            <div id="modalIcon" class="text-7xl mb-6"></div>
            <h2 id="modalTitle" class="text-4xl font-bold mb-4"></h2>
            <p id="modalMessage" class="text-2xl text-gray-600 mb-8"></p>
            <button id="modalNextBtn" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-8 rounded-2xl text-2xl shadow-md transition-colors">
                下一題 <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </div>
    </div>

    <script>
        // --- STREAMING_CHUNK:Initializing element selectors and state variables... ---
        // Themes configuration
        const THEMES = {
            apple: { name: '蘋果', unit: '個', icon: '🍎' },
            star: { name: '星星', unit: '粒', icon: '⭐' },
            candy: { name: '糖果', unit: '粒', icon: '🍬' },
            cat: { name: '貓咪', unit: '隻', icon: '🐱' },
            robot: { name: '機械人', unit: '個', icon: '🤖' }
        };

        // Application State
        const state = {
            level: 1,
            range: 10,
            theme: 'apple',
            voiceEnabled: true,
            showTotalEnabled: true,
            inputMode: 'handwriting',
            sourceCount: 0,
            initialDestCount: 0,
            currentSourceItems: 0,
            currentDestItems: 0,
            targetTotal: 0,
            gameActive: false
        };

        // --- DOM Elements ---
        const els = {
            levelSelect: document.getElementById('levelSelect'),
            rangeSelect: document.getElementById('rangeSelect'),
            themeSelect: document.getElementById('themeSelect'),
            inputModeSelect: document.getElementById('inputModeSelect'),
            voiceToggle: document.getElementById('voiceToggle'),
            showTotalToggle: document.getElementById('showTotalToggle'),
            showTotalToggleContainer: document.getElementById('showTotalToggleContainer'),
            newGameBtn: document.getElementById('newGameBtn'),
            
            sourceBasket: document.getElementById('sourceBasket'),
            destBasket: document.getElementById('destBasket'),
            destCountBadge: document.getElementById('destCountBadge'),
            initialCountDisplay: document.getElementById('initialCountDisplay'),
            initialCountNum: document.getElementById('initialCountNum'),
            moveAllBtn: document.getElementById('moveAllBtn'),
            
            handwritingContainer: document.getElementById('handwritingContainer'),
            keyboardContainer: document.getElementById('keyboardContainer'),
            hwCanvas: document.getElementById('hwCanvas'),
            hwPlaceholder: document.getElementById('hwPlaceholder'),
            clearHwBtn: document.getElementById('clearHwBtn'),
            
            answerInput: document.getElementById('answerInput'),
            submitBtn: document.getElementById('submitBtn'),
            feedbackArea: document.getElementById('feedbackArea'),
            
            resultModal: document.getElementById('resultModal'),
            modalIcon: document.getElementById('modalIcon'),
            modalTitle: document.getElementById('modalTitle'),
            modalMessage: document.getElementById('modalMessage'),
            modalNextBtn: document.getElementById('modalNextBtn')
        };

        // Canvas Handwriting Logic
        let hwCtx = null;
        let isDrawing = false;
        let hasDrawn = false;

        function initHandwritingCanvas() {
            const canvas = els.hwCanvas;

            function resizeCanvasResolution() {
                const rect = canvas.getBoundingClientRect();
                if (rect.width && rect.height) {
                    canvas.width = rect.width;
                    canvas.height = rect.height;
                    if (hwCtx) {
                        hwCtx.lineWidth = 10;
                        hwCtx.lineCap = 'round';
                        hwCtx.lineJoin = 'round';
                        hwCtx.strokeStyle = '#16a34a';
                    }
                }
            }

            hwCtx = canvas.getContext('2d');
            resizeCanvasResolution();
            window.addEventListener('resize', resizeCanvasResolution);

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                return {
                    x: (clientX - rect.left) * (canvas.width / rect.width),
                    y: (clientY - rect.top) * (canvas.height / rect.height)
                };
            }

            function startDraw(e) {
                if (!state.gameActive) return;
                isDrawing = true;
                hasDrawn = true;
                els.hwPlaceholder.classList.add('hidden');
                const pos = getPos(e);
                hwCtx.beginPath();
                hwCtx.moveTo(pos.x, pos.y);
            }

            function moveDraw(e) {
                if (!isDrawing || !state.gameActive) return;
                const pos = getPos(e);
                hwCtx.lineTo(pos.x, pos.y);
                hwCtx.stroke();
            }

            function endDraw() {
                isDrawing = false;
            }

            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', moveDraw);
            canvas.addEventListener('mouseup', endDraw);
            canvas.addEventListener('mouseleave', endDraw);

            canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e); }, { passive: false });
            canvas.addEventListener('touchmove', (e) => { e.preventDefault(); moveDraw(e); }, { passive: false });
            canvas.addEventListener('touchend', endDraw);
        }

        function clearCanvas() {
            if (!state.gameActive) return;
            if (!hwCtx) return;
            hwCtx.clearRect(0, 0, els.hwCanvas.width, els.hwCanvas.height);
            hasDrawn = false;
            els.hwPlaceholder.classList.remove('hidden');
        }

        els.inputModeSelect.addEventListener('change', (e) => setInputMode(e.target.value));
        els.clearHwBtn.addEventListener('click', clearCanvas);

        function setInputMode(mode) {
            state.inputMode = mode;
            els.inputModeSelect.value = mode;
            if (mode === 'handwriting') {
                els.handwritingContainer.classList.remove('hidden');
                els.keyboardContainer.classList.add('hidden');
            } else {
                els.handwritingContainer.classList.add('hidden');
                els.keyboardContainer.classList.remove('hidden');
                els.answerInput.focus();
            }
        }

        let toneSynth = null;
        let tonePolySynth = null;
        let toneMembraneSynth = null;
        let isToneInitialized = false;

        async function initTone() {
            if (isToneInitialized) return;
            await Tone.start();
            toneSynth = new Tone.Synth().toDestination();
            tonePolySynth = new Tone.PolySynth(Tone.Synth).toDestination();
            toneMembraneSynth = new Tone.MembraneSynth().toDestination();
            isToneInitialized = true;
        }

        async function playCorrectSound() {
            try {
                await initTone();
                const now = Tone.now();
                tonePolySynth.triggerAttackRelease("C4", "8n", now);
                tonePolySynth.triggerAttackRelease("E4", "8n", now + 0.1);
                tonePolySynth.triggerAttackRelease("G4", "8n", now + 0.2);
                tonePolySynth.triggerAttackRelease("C5", "4n", now + 0.3);
            } catch (e) {}
        }

        async function playWrongSound() {
            try {
                await initTone();
                const now = Tone.now();
                toneSynth.triggerAttackRelease("C3", "8n", now);
                toneSynth.triggerAttackRelease("C2", "8n", now + 0.15);
            } catch (e) {}
        }

        async function playDropSound() {
            try {
                await initTone();
                toneMembraneSynth.triggerAttackRelease("C4", "8n");
            } catch (e) {}
        }

        // --- STREAMING_CHUNK:Core Game Logic - Initialization... ---
        
        const synth = window.speechSynthesis;
        let cantoneseVoice = null;
        
        function initVoices() {
            const voices = synth.getVoices();
            cantoneseVoice = voices.find(v => v.lang.includes('zh-HK') || v.lang.includes('yue')) || 
                             voices.find(v => v.lang.includes('zh')) || 
                             null;
        }
        
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = initVoices;
        }

        function speak(text) {
            if (!state.voiceEnabled || !text) return;
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            if (cantoneseVoice) {
                utterance.voice = cantoneseVoice;
            }
            utterance.lang = 'zh-HK'; // 確保回落到廣東話語音
            utterance.text = text;
            utterance.rate = 0.9; 
            synth.speak(utterance);
        }

        function initGame() {
            state.level = parseInt(els.levelSelect.value);
            state.range = parseInt(els.rangeSelect.value);
            state.theme = els.themeSelect.value;
            state.voiceEnabled = els.voiceToggle.checked;
            state.showTotalEnabled = els.showTotalToggle.checked;
            state.inputMode = els.inputModeSelect.value;
            
            if (state.level === 1) {
                els.showTotalToggleContainer.style.display = 'flex';
                els.initialCountDisplay.classList.add('hidden');
                state.initialDestCount = 0;
            } else {
                els.showTotalToggleContainer.style.display = 'none';
                els.initialCountDisplay.classList.remove('hidden');
            }

            generateNumbers();
            
            state.currentSourceItems = state.sourceCount;
            state.currentDestItems = state.initialDestCount;
            state.gameActive = true;
            
            els.answerInput.value = '';
            els.answerInput.disabled = false;
            els.submitBtn.disabled = false;
            els.feedbackArea.classList.add('hidden');
            els.moveAllBtn.classList.add('hidden');
            
            clearCanvas();
            renderBaskets();
            updateUI();
            
            // 已經移除起步時的長句語音，讓它只在數數時發聲
        }

        // --- STREAMING_CHUNK:Number generation and rendering logic... ---

        function generateNumbers() {
            let maxTotal = state.range;
            
            if (state.level === 1) {
                state.initialDestCount = 0;
                if (maxTotal <= 10) {
                    state.sourceCount = Math.floor(Math.random() * (maxTotal - 1)) + 2;
                } else {
                    state.sourceCount = Math.floor(Math.random() * (maxTotal - 5)) + 5;
                }
                state.targetTotal = state.sourceCount;
            } else {
                if (maxTotal <= 10) {
                    state.initialDestCount = Math.floor(Math.random() * (maxTotal - 2)) + 1;
                    let remaining = maxTotal - state.initialDestCount;
                    state.sourceCount = Math.floor(Math.random() * remaining) + 1;
                } else if (maxTotal === 50) {
                    const multiplesOf5 = [5, 10, 15, 20, 25, 30];
                    state.initialDestCount = multiplesOf5[Math.floor(Math.random() * multiplesOf5.length)];
                    state.sourceCount = Math.floor(Math.random() * (maxTotal - state.initialDestCount - 2)) + 2;
                } else if (maxTotal === 100) {
                     const multiplesOf10 = [10, 20, 30, 40, 50, 60];
                     state.initialDestCount = multiplesOf10[Math.floor(Math.random() * multiplesOf10.length)];
                     state.sourceCount = Math.floor(Math.random() * (maxTotal - state.initialDestCount - 5)) + 5;
                } else if (maxTotal === 300) {
                     const multiplesOf50 = [50, 100, 150, 200];
                     state.initialDestCount = multiplesOf50[Math.floor(Math.random() * multiplesOf50.length)];
                     state.sourceCount = Math.floor(Math.random() * (maxTotal - state.initialDestCount - 10)) + 10;
                }
                state.targetTotal = state.initialDestCount + state.sourceCount;
            }
        }

        function getBundleSize(range) {
             if (range === 50) return 5;
             if (range === 100) return 10;
             if (range === 300) return 50;
             return 1;
        }

        function createItemElement(id, type, count = 1) {
            const theme = THEMES[state.theme];
            const div = document.createElement('div');
            div.id = `item-${type}-${id}`;
            
            if (count > 1) {
                div.className = 'item-bundle hover:scale-105';
                div.innerHTML = `<span class="bundle-icon">${theme.icon}</span> x${count}`;
                div.dataset.value = count;
            } else {
                div.className = 'item-icon';
                div.innerHTML = theme.icon;
                div.dataset.value = 1;
            }
            
            if (type === 'source' && state.gameActive) {
                div.addEventListener('mousedown', handleDragStart);
                div.addEventListener('touchstart', handleDragStart, {passive: false});
            }
            return div;
        }

        function renderBaskets() {
            els.sourceBasket.innerHTML = '';
            els.destBasket.innerHTML = '';
            
            const bundleSize = getBundleSize(state.range);
            
            if (state.initialDestCount > 0) {
                 renderItemsIntoBasket(els.destBasket, 'dest_init', state.initialDestCount, bundleSize, false);
            }
            
            renderItemsIntoBasket(els.sourceBasket, 'source', state.currentSourceItems, bundleSize, true);
            
            if (state.currentSourceItems > 10) {
                els.moveAllBtn.classList.remove('hidden');
            }
        }

        function renderItemsIntoBasket(container, idPrefix, totalCount, bundleSize, clickable) {
            let remaining = totalCount;
            let idCounter = 0;
            
            if (bundleSize > 1) {
                let numBundles = Math.floor(remaining / bundleSize);
                for (let i = 0; i < numBundles; i++) {
                    const item = createItemElement(`${idPrefix}-b${idCounter++}`, idPrefix.includes('source') ? 'source' : 'dest', bundleSize);
                    if (!clickable) item.style.pointerEvents = 'none';
                    container.appendChild(item);
                }
                remaining = remaining % bundleSize;
            }
            
            for (let i = 0; i < remaining; i++) {
                 const item = createItemElement(`${idPrefix}-s${idCounter++}`, idPrefix.includes('source') ? 'source' : 'dest', 1);
                 if (!clickable) item.style.pointerEvents = 'none';
                 container.appendChild(item);
            }
        }

        // --- STREAMING_CHUNK:Interaction logic: Moving items... ---

        let draggedElement = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let draggedOriginalParent = null;
        let draggedOriginalSibling = null;

        function handleDragStart(e) {
            if (!state.gameActive) return;
            
            if (e.type === 'touchstart') {
                e.preventDefault();
            }

            draggedElement = e.currentTarget;
            draggedOriginalParent = draggedElement.parentNode;
            draggedOriginalSibling = draggedElement.nextSibling;

            const rect = draggedElement.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);

            dragOffsetX = clientX - rect.left;
            dragOffsetY = clientY - rect.top;

            draggedElement.classList.add('dragging');
            draggedElement.style.position = 'fixed';
            draggedElement.style.zIndex = '9999';
            draggedElement.style.left = (clientX - dragOffsetX) + 'px';
            draggedElement.style.top = (clientY - dragOffsetY) + 'px';
            draggedElement.style.margin = '0';

            document.body.appendChild(draggedElement);

            document.addEventListener('mousemove', handleDragMove, { passive: false });
            document.addEventListener('touchmove', handleDragMove, { passive: false });
            document.addEventListener('mouseup', handleDragEnd);
            document.addEventListener('touchend', handleDragEnd);
        }

        function handleDragMove(e) {
            if (!draggedElement) return;
            if (e.type === 'touchmove') {
                e.preventDefault();
            }
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);

            draggedElement.style.left = (clientX - dragOffsetX) + 'px';
            draggedElement.style.top = (clientY - dragOffsetY) + 'px';
        }

        function handleDragEnd(e) {
            if (!draggedElement) return;

            document.removeEventListener('mousemove', handleDragMove);
            document.removeEventListener('touchmove', handleDragMove);
            document.removeEventListener('mouseup', handleDragEnd);
            document.removeEventListener('touchend', handleDragEnd);

            const clientX = e.clientX || (e.changedTouches && e.changedTouches[0].clientX);
            const clientY = e.clientY || (e.changedTouches && e.changedTouches[0].clientY);

            const destBasket = els.destBasket.getBoundingClientRect();
            const padding = 20;

            if (
                clientX >= destBasket.left - padding &&
                clientX <= destBasket.right + padding &&
                clientY >= destBasket.top - padding &&
                clientY <= destBasket.bottom + padding
            ) {
                handleDropSuccess(draggedElement);
            } else {
                draggedOriginalParent.insertBefore(draggedElement, draggedOriginalSibling);
                resetDraggedElementStyle();
            }

            draggedElement = null;
        }

        function resetDraggedElementStyle() {
            if (!draggedElement) return;
            draggedElement.style.position = '';
            draggedElement.style.zIndex = '';
            draggedElement.style.left = '';
            draggedElement.style.top = '';
            draggedElement.style.margin = '';
            draggedElement.classList.remove('dragging');
        }

        function handleDropSuccess(element) {
            const itemValue = parseInt(element.dataset.value);
            
            state.currentSourceItems -= itemValue;
            state.currentDestItems += itemValue;
            
            resetDraggedElementStyle();
            
            element.removeEventListener('mousedown', handleDragStart);
            element.removeEventListener('touchstart', handleDragStart);
            element.classList.remove('cursor-grab', 'hover:scale-105');
            element.style.pointerEvents = 'none';
            
            els.destBasket.appendChild(element);
            
            handleCountingSpeech(itemValue);
            updateUI();
            
            if (state.currentSourceItems === 0) {
                 els.moveAllBtn.classList.add('hidden');
                 // 移除了完成搬運後的長句提示
            }
        }
        
        function handleCountingSpeech(itemValue) {
            let textToSpeak = "";
            if (state.level === 1 && !state.showTotalEnabled) {
                // 不顯示總數時，只讀出當前移動的數字值 (如 "1" 或 "5")
                textToSpeak = `${itemValue}`;
            } else {
                // 讀出累積後的數字總和 (如 "1", "2", "3")
                textToSpeak = `${state.currentDestItems}`;
            }
            speak(textToSpeak);
            
            els.destCountBadge.classList.add('scale-150', 'bg-green-300');
            setTimeout(() => {
                els.destCountBadge.classList.remove('scale-150', 'bg-green-300');
            }, 300);
        }

        els.moveAllBtn.addEventListener('click', () => {
             if(!state.gameActive) return;
             const sourceItems = Array.from(els.sourceBasket.children);
             let delay = 0;
             sourceItems.forEach(item => {
                 setTimeout(() => {
                     item.style.transition = 'opacity 0.2s';
                     item.style.opacity = '0';
                     setTimeout(() => {
                         item.style.opacity = '1';
                         draggedElement = item;
                         handleDropSuccess(item);
                     }, 200);
                 }, delay);
                 delay += 150;
             });
        });

        // --- STREAMING_CHUNK:Updating UI state and handling submissions... ---

        function updateUI() {
            if (state.level === 1) {
                if (state.showTotalEnabled) {
                    els.destCountBadge.textContent = state.currentDestItems;
                    els.destCountBadge.style.opacity = '1';
                } else {
                    els.destCountBadge.textContent = "?";
                    els.destCountBadge.style.opacity = '0.5';
                }
            } else {
                els.destCountBadge.textContent = state.currentDestItems;
                els.destCountBadge.style.opacity = '1';
                els.initialCountNum.textContent = state.initialDestCount;
            }
        }

        els.submitBtn.addEventListener('click', checkAnswer);
        els.answerInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });

        function checkAnswer() {
            if (!state.gameActive) {
                resetGameStyles();
                initGame();
                return;
            }
            
            if (state.currentSourceItems > 0) {
                 playWrongSound();
                 els.feedbackArea.innerHTML = '<span class="text-orange-500"><i class="fa-solid fa-circle-exclamation"></i> 請先將左邊隻碟所有物品移到右邊！</span>';
                 els.feedbackArea.classList.remove('hidden', 'bg-green-100', 'bg-red-100');
                 els.feedbackArea.classList.add('bg-orange-100');
                 return;
            }

            // In handwriting mode, if drawn, we confirm answer check directly
            if (state.inputMode === 'handwriting') {
                if (!hasDrawn) {
                    playWrongSound();
                    els.feedbackArea.innerHTML = '<span class="text-orange-500"><i class="fa-solid fa-circle-exclamation"></i> 請先手寫答案！</span>';
                    els.feedbackArea.classList.remove('hidden', 'bg-green-100', 'bg-red-100');
                    els.feedbackArea.classList.add('bg-orange-100');
                    return;
                }
                
                // Draw correct answer on canvas in gray
                hwCtx.font = "bold 200px Arial";
                hwCtx.fillStyle = "rgba(156, 163, 175, 0.4)"; // Gray, transparent
                hwCtx.textAlign = "center";
                hwCtx.textBaseline = "middle";
                hwCtx.fillText(state.targetTotal, els.hwCanvas.width / 2, els.hwCanvas.height / 2);

                playCorrectSound();
                
                state.gameActive = false;
                els.submitBtn.innerHTML = '<i class="fa-solid fa-arrow-right mr-2"></i> 下一題';
                els.submitBtn.classList.remove('bg-green-500', 'hover:bg-green-600');
                els.submitBtn.classList.add('bg-blue-500', 'hover:bg-blue-600');
                els.feedbackArea.classList.add('hidden');
                
            } else {
                const userAnswer = parseInt(els.answerInput.value);
                if (isNaN(userAnswer)) {
                    playWrongSound();
                    els.answerInput.classList.add('shake');
                    setTimeout(() => els.answerInput.classList.remove('shake'), 500);
                    return;
                }

                if (userAnswer === state.targetTotal) {
                    handleCorrectAnswer();
                } else {
                    handleIncorrectAnswer(userAnswer);
                }
            }
        }

        // --- STREAMING_CHUNK:Result handling and Modal display... ---

        function handleCorrectAnswer() {
            state.gameActive = false;
            els.answerInput.disabled = true;
            els.submitBtn.disabled = true;

            playCorrectSound();
            
            els.modalIcon.innerHTML = '🎉';
            els.modalIcon.className = 'text-7xl mb-6 text-yellow-400 celebrate inline-block';
            els.modalTitle.textContent = '答啱咗！好叻仔/女！';
            els.modalTitle.className = 'text-4xl font-bold mb-4 text-green-600';
            els.modalMessage.textContent = `總共係 ${state.targetTotal}！`;

            showModal();
        }

        function handleIncorrectAnswer(userAnswer) {
            playWrongSound();
            
            els.answerInput.classList.add('border-red-500', 'bg-red-50', 'text-red-600', 'shake');
            
            els.modalIcon.innerHTML = '💡';
            els.modalIcon.className = 'text-7xl mb-6 text-blue-400 inline-block';
            els.modalTitle.textContent = '再試一次！';
            els.modalTitle.className = 'text-4xl font-bold mb-4 text-red-500';
            els.modalMessage.innerHTML = `你填咗 <b>${userAnswer}</b>。<br>正確答案總共係 <b>${state.targetTotal}</b>。`;

            showModal();
        }

        function showModal() {
            setTimeout(() => {
                els.resultModal.classList.remove('hidden');
                setTimeout(() => {
                    els.resultModal.firstElementChild.classList.remove('scale-95');
                    els.resultModal.firstElementChild.classList.add('scale-100');
                }, 10);
            }, 800);
        }

        function hideModal() {
            els.resultModal.firstElementChild.classList.remove('scale-100');
            els.resultModal.firstElementChild.classList.add('scale-95');
            setTimeout(() => {
                els.resultModal.classList.add('hidden');
                resetGameStyles();
                initGame();
            }, 300);
        }

        function resetGameStyles() {
             els.answerInput.classList.remove('border-green-500', 'bg-green-50', 'text-green-600', 'border-red-500', 'bg-red-50', 'text-red-600', 'shake');
             els.answerInput.value = '';
             
             els.submitBtn.innerHTML = '<i class="fa-solid fa-check-circle mr-2"></i> 提交答案';
             els.submitBtn.classList.remove('bg-blue-500', 'hover:bg-blue-600');
             els.submitBtn.classList.add('bg-green-500', 'hover:bg-green-600');
             els.submitBtn.disabled = false;
        }

        // --- STREAMING_CHUNK:Event Listeners setup... ---

        [els.levelSelect, els.rangeSelect, els.themeSelect, els.showTotalToggle].forEach(el => {
            el.addEventListener('change', () => {
                resetGameStyles();
                initGame();
            });
        });
        
        els.voiceToggle.addEventListener('change', () => {
            state.voiceEnabled = els.voiceToggle.checked;
        });

        els.newGameBtn.addEventListener('click', () => {
            resetGameStyles();
            initGame();
        });
        
        els.modalNextBtn.addEventListener('click', hideModal);

        window.addEventListener('load', () => {
            initHandwritingCanvas();
            setInputMode('handwriting');
            initGame();
        });

    </script>
</body>
