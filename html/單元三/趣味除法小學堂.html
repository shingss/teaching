<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>互動式除法教學</title>
  
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入 React 和 ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 引入 Babel 用於在瀏覽器中編譯 JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- 定義自訂動畫 -->
  <style>
    @keyframes bounce-in {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-bounce-in {
      animation: bounce-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fade-in 0.5s ease-out forwards;
    }
  </style>
</head>
<body class="bg-blue-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- 圖示組件 (取代 lucide-react) ---
    const Icon = ({ children, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {children}
      </svg>
    );
    const Users = ({ className }) => <Icon className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></Icon>;
    const Package = ({ className }) => <Icon className={className}><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" y1="22" x2="12" y2="12"/></Icon>;
    const Play = ({ className }) => <Icon className={className}><polygon points="6 3 20 12 6 21 6 3"/></Icon>;
    const RefreshCcw = ({ className }) => <Icon className={className}><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21v-5h5"/></Icon>;
    const ArrowRight = ({ className }) => <Icon className={className}><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></Icon>;
    const FastForward = ({ className }) => <Icon className={className}><polygon points="13 19 22 12 13 5 13 19"/><polygon points="2 19 11 12 2 5 2 19"/></Icon>;
    const Loader2 = ({ className }) => <Icon className={className}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></Icon>;
    const ImagePlus = ({ className }) => <Icon className={className}><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7"/><line x1="16" y1="5" x2="22" y2="5"/><line x1="19" y1="2" x2="19" y2="8"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></Icon>;
    const CircleDashed = ({ className }) => <Icon className={className}><path d="M10.1 2.18a9.93 9.93 0 0 1 3.8 0"/><path d="M17.6 4.26a9.95 9.95 0 0 1 2.14 3.14"/><path d="M21.82 10.1a9.93 9.93 0 0 1 0 3.8"/><path d="M19.74 17.6a9.95 9.95 0 0 1-3.14 2.14"/><path d="M13.9 21.82a9.94 9.94 0 0 1-3.8 0"/><path d="M6.4 19.74a9.95 9.95 0 0 1-2.14-3.14"/><path d="M2.18 13.9a9.93 9.93 0 0 1 0-3.8"/><path d="M4.26 6.4A9.95 9.95 0 0 1 7.4 4.26"/></Icon>;

    // --- 主程式 ---
    function App() {
      const [mode, setMode] = useState('sharing'); 
      const [total, setTotal] = useState(12);
      const [divisor, setDivisor] = useState(3);
      
      const [status, setStatus] = useState('idle');
      const [currentStep, setCurrentStep] = useState(0);
      
      const [itemEmoji, setItemEmoji] = useState('🍎');
      const [itemImage, setItemImage] = useState(null); 
      const emojis = ['🍎', '🍬', '⭐', '⚽', '🍓', '🎈'];

      const quotient = Math.floor(total / divisor);
      const remainder = total % divisor;
      const distributableCount = quotient * divisor;

      useEffect(() => {
        setStatus('idle');
        setCurrentStep(0);
      }, [total, divisor, mode, itemEmoji]);

      useEffect(() => {
        let timer;
        if (status === 'animating') {
          if (currentStep < total) {
            timer = setTimeout(() => {
              setCurrentStep(prev => prev + 1);
            }, 400); 
          } else {
            setStatus('finished');
          }
        }
        return () => clearTimeout(timer);
      }, [status, currentStep, total]);

      const handleDistribute = () => {
        setStatus('animating');
        setCurrentStep(0);
      };

      const handleSkipAnimation = () => {
        setCurrentStep(total);
        setStatus('finished');
      };

      const handleReset = () => {
        setStatus('idle');
        setCurrentStep(0);
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const url = URL.createObjectURL(file);
          setItemImage(url);
        }
      };

      const renderItem = (sizeClass, animateClass = "") => {
        if (itemImage) {
          let imgSize = "w-8 h-8"; 
          if (sizeClass.includes("text-4xl")) imgSize = "w-10 h-10 md:w-12 md:h-12";
          if (sizeClass.includes("text-3xl")) imgSize = "w-8 h-8 md:w-10 md:h-10";
          if (sizeClass.includes("text-2xl")) imgSize = "w-6 h-6 md:w-8 md:h-8";
          return <img src={itemImage} className={`${imgSize} object-contain ${animateClass}`} alt="item" />;
        }
        return <div className={`${sizeClass} ${animateClass}`}>{itemEmoji}</div>;
      };

      return (
        <div className="min-h-screen p-4 md:p-8 font-sans text-gray-800 pb-20">
          <div className="max-w-4xl mx-auto bg-white rounded-3xl shadow-xl overflow-hidden">
            
            {/* 標題與模式切換 */}
            <div className="bg-indigo-600 text-white p-6 transition-colors duration-500">
              <h1 className="text-3xl font-bold text-center mb-6 flex justify-center items-center gap-3">
                <span>🌟</span> 趣味除法小學堂 <span>🌟</span>
              </h1>
              <div className="flex flex-wrap justify-center gap-3">
                <button
                  onClick={() => status === 'idle' && setMode('sharing')}
                  disabled={status !== 'idle'}
                  className={`flex items-center px-4 py-3 rounded-full font-bold transition-all ${
                    mode === 'sharing' ? 'bg-white text-indigo-600 shadow-lg scale-105' : 'bg-indigo-500 text-white'
                  } ${status !== 'idle' ? 'opacity-50 cursor-not-allowed' : 'hover:bg-indigo-400'}`}
                >
                  <Users className="w-5 h-5 mr-2" />
                  平分給人
                </button>
                <button
                  onClick={() => status === 'idle' && setMode('partitioning')}
                  disabled={status !== 'idle'}
                  className={`flex items-center px-4 py-3 rounded-full font-bold transition-all ${
                    mode === 'partitioning' ? 'bg-white text-indigo-600 shadow-lg scale-105' : 'bg-indigo-500 text-white'
                  } ${status !== 'idle' ? 'opacity-50 cursor-not-allowed' : 'hover:bg-indigo-400'}`}
                >
                  <CircleDashed className="w-5 h-5 mr-2" />
                  畫圈分組
                </button>
                <button
                  onClick={() => status === 'idle' && setMode('grouping')}
                  disabled={status !== 'idle'}
                  className={`flex items-center px-4 py-3 rounded-full font-bold transition-all ${
                    mode === 'grouping' ? 'bg-white text-indigo-600 shadow-lg scale-105' : 'bg-indigo-500 text-white'
                  } ${status !== 'idle' ? 'opacity-50 cursor-not-allowed' : 'hover:bg-indigo-400'}`}
                >
                  <Package className="w-5 h-5 mr-2" />
                  每幾個一袋
                </button>
              </div>
            </div>

            {/* 控制面板 */}
            <div className={`p-6 bg-indigo-50 border-b border-indigo-100 flex flex-col md:flex-row gap-6 items-center justify-between transition-opacity duration-300 ${status !== 'idle' ? 'opacity-60 pointer-events-none' : ''}`}>
              <div className="flex-1 w-full space-y-4">
                <div>
                  <label className="block text-sm font-bold text-gray-700 mb-1 flex justify-between">
                    <span>總共有幾個物品？</span>
                    <span className="text-indigo-600 text-lg">{total}</span>
                  </label>
                  <input
                    type="range" min="1" max="30" value={total}
                    onChange={(e) => setTotal(parseInt(e.target.value))}
                    className="w-full h-2 bg-indigo-200 rounded-lg appearance-none cursor-pointer accent-indigo-600"
                  />
                </div>
                
                <div>
                  <label className="block text-sm font-bold text-gray-700 mb-1 flex justify-between">
                    <span>
                      {mode === 'sharing' && '要平分給幾個人？'}
                      {mode === 'partitioning' && '要畫成幾個圈(組)？'}
                      {mode === 'grouping' && '每幾個裝成一袋？'}
                    </span>
                    <span className="text-pink-600 text-lg">{divisor}</span>
                  </label>
                  <input
                    type="range" min="1" max="10" value={divisor}
                    onChange={(e) => setDivisor(parseInt(e.target.value))}
                    className="w-full h-2 bg-indigo-200 rounded-lg appearance-none cursor-pointer accent-indigo-600"
                  />
                </div>
              </div>

              <div className="flex flex-col items-center space-y-2">
                <label className="text-sm font-bold text-gray-700">選擇物品：</label>
                <div className="flex space-x-2 bg-white p-2 rounded-xl shadow-inner max-w-[280px] overflow-x-auto">
                  {emojis.map(e => (
                    <button
                      key={e} onClick={() => { setItemEmoji(e); setItemImage(null); }}
                      className={`text-2xl w-10 h-10 flex-shrink-0 rounded-lg transition-transform hover:scale-110 ${itemEmoji === e && !itemImage ? 'bg-indigo-100 ring-2 ring-indigo-400 scale-110' : ''}`}
                    >
                      {e}
                    </button>
                  ))}
                  <label className={`cursor-pointer flex items-center justify-center w-10 h-10 flex-shrink-0 rounded-lg transition-transform hover:scale-110 ${itemImage ? 'bg-indigo-100 ring-2 ring-indigo-400 scale-110' : 'bg-gray-100 hover:bg-gray-200'}`} title="上傳自訂圖片">
                    <ImagePlus className="w-5 h-5 text-gray-600" />
                    <input type="file" accept="image/*" className="hidden" onChange={handleImageUpload} />
                  </label>
                </div>
              </div>
            </div>

            {/* 按鈕與提示區 */}
            <div className="p-6 text-center border-b border-gray-100">
              <div className="text-xl md:text-2xl font-medium text-gray-600 mb-6 h-8">
                {mode === 'sharing' && <span>將 <strong className="text-indigo-600 text-3xl mx-1">{total}</strong> 個物品，平分給 <strong className="text-pink-500 text-3xl mx-1">{divisor}</strong> 個人</span>}
                {mode === 'partitioning' && <span>將 <strong className="text-indigo-600 text-3xl mx-1">{total}</strong> 個物品，平均分成 <strong className="text-pink-500 text-3xl mx-1">{divisor}</strong> 組</span>}
                {mode === 'grouping' && <span>將 <strong className="text-indigo-600 text-3xl mx-1">{total}</strong> 個物品，每 <strong className="text-green-500 text-3xl mx-1">{divisor}</strong> 個裝成一袋</span>}
              </div>
              
              <div className="flex justify-center items-center space-x-4">
                {status === 'idle' && (
                  <button
                    onClick={handleDistribute}
                    className="flex items-center bg-green-500 hover:bg-green-600 text-white px-8 py-4 rounded-2xl font-bold text-xl shadow-lg transition-transform hover:scale-105 active:scale-95"
                  >
                    <Play className="w-6 h-6 mr-2" />
                    開始分配！
                  </button>
                )}
                
                {status === 'animating' && (
                  <>
                    <button disabled className="flex items-center bg-indigo-400 text-white px-8 py-4 rounded-2xl font-bold text-xl shadow-md cursor-not-allowed">
                      <Loader2 className="w-6 h-6 mr-2 animate-spin" />
                      分配中... ({currentStep}/{total})
                    </button>
                    <button
                      onClick={handleSkipAnimation}
                      className="flex items-center bg-gray-200 hover:bg-gray-300 text-gray-700 px-6 py-4 rounded-2xl font-bold text-lg shadow-sm transition-transform hover:scale-105 active:scale-95"
                    >
                      <FastForward className="w-5 h-5 mr-2" />
                      直接看結果
                    </button>
                  </>
                )}

                {status === 'finished' && (
                  <button
                    onClick={handleReset}
                    className="flex items-center bg-gray-600 hover:bg-gray-700 text-white px-8 py-4 rounded-2xl font-bold text-xl shadow-lg transition-transform hover:scale-105 active:scale-95"
                  >
                    <RefreshCcw className="w-6 h-6 mr-2" />
                    重新開始
                  </button>
                )}
              </div>
            </div>

            {/* 視覺呈現區 */}
            <div className="p-8 bg-gray-50 min-h-[500px] relative">
              
              {/* 上方：未分配的物品池 */}
              {status !== 'finished' && (
                <div className={`flex flex-col items-center mb-10 transition-opacity duration-500 ${currentStep === total ? 'opacity-0' : 'opacity-100'}`}>
                  <div className="text-lg font-bold text-gray-500 mb-3 flex items-center gap-2">
                    全部的物品池 <span className="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-sm">還剩 {total - currentStep} 個</span>
                  </div>
                  <div className="flex flex-wrap justify-center gap-2 max-w-2xl bg-white p-6 rounded-3xl shadow-inner border-2 border-dashed border-gray-300 min-h-[100px] w-full">
                    {Array.from({ length: total - currentStep }).map((_, i) => (
                      <div key={`source-${i}`} style={{animationDelay: `${i * 0.02}s`}}>
                        {renderItem("text-4xl", "animate-pulse")}
                      </div>
                    ))}
                    {total - currentStep === 0 && <div className="text-gray-300 font-medium my-2">全部分發完畢！</div>}
                  </div>
                  
                  <div className="mt-6 text-gray-300">
                    <ArrowRight className="w-10 h-10 mx-auto animate-bounce transform rotate-90" />
                  </div>
                </div>
              )}

              {/* 容器區域：平分模式 或 畫圈分組模式 */}
              {(status !== 'idle' || ['sharing', 'partitioning'].includes(mode)) && ['sharing', 'partitioning'].includes(mode) && (
                <div className="space-y-8 animate-fade-in">
                  <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 lg:grid-cols-5 gap-6 justify-items-center">
                    {Array.from({ length: divisor }).map((_, personIdx) => {
                      
                      let itemCount = 0;
                      if (currentStep <= distributableCount) {
                        const rounds = Math.floor(currentStep / divisor);
                        const extra = currentStep % divisor;
                        itemCount = rounds + (personIdx < extra ? 1 : 0);
                      } else {
                        itemCount = quotient;
                      }

                      const isJustReceived = status === 'animating' && currentStep > 0 && currentStep <= distributableCount && ((currentStep - 1) % divisor) === personIdx;

                      return (
                        <div key={personIdx} className={`bg-white p-4 rounded-2xl shadow-md border-4 flex flex-col items-center w-full max-w-[160px] transition-all duration-300 ${isJustReceived ? 'border-pink-400 shadow-pink-200 scale-110 -translate-y-2' : 'border-pink-100'}`}>
                          <div className={`w-14 h-14 rounded-full flex items-center justify-center mb-2 transition-colors duration-300 ${isJustReceived ? 'bg-pink-200' : 'bg-pink-50'}`}>
                            {mode === 'sharing' ? (
                              <Users className={`w-7 h-7 ${isJustReceived ? 'text-pink-600' : 'text-pink-400'}`} />
                            ) : (
                              <CircleDashed className={`w-7 h-7 ${isJustReceived ? 'text-pink-600' : 'text-pink-400'}`} />
                            )}
                          </div>
                          <div className="text-sm font-bold text-pink-500 mb-2 bg-pink-50 px-3 py-1 rounded-full">
                            {mode === 'sharing' ? `第 ${personIdx + 1} 人` : `第 ${personIdx + 1} 組`}
                          </div>
                          <div className="flex flex-wrap justify-center gap-1 min-h-[50px] mt-2">
                            {Array.from({ length: itemCount }).map((_, itemIdx) => (
                              <div key={itemIdx}>
                                {renderItem("text-2xl", "animate-bounce-in")}
                              </div>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* 容器區域：分組模式 */}
              {(status !== 'idle' || mode === 'grouping') && mode === 'grouping' && (
                <div className="space-y-8 animate-fade-in">
                  {quotient > 0 ? (
                    <div className="flex flex-wrap justify-center gap-6">
                      {Array.from({ length: quotient }).map((_, groupIdx) => {
                        
                        let itemCount = 0;
                        if (currentStep <= distributableCount) {
                          const currentFillingGroup = Math.floor(currentStep / divisor);
                          if (groupIdx < currentFillingGroup) itemCount = divisor; 
                          else if (groupIdx === currentFillingGroup) itemCount = currentStep % divisor; 
                          else itemCount = 0; 
                        } else {
                          itemCount = divisor; 
                        }

                        const isJustReceived = status === 'animating' && currentStep > 0 && currentStep <= distributableCount && Math.floor((currentStep - 1) / divisor) === groupIdx;

                        return (
                          <div key={groupIdx} className={`bg-white p-5 rounded-3xl shadow-md border-4 flex flex-col items-center relative transition-all duration-300 ${isJustReceived ? 'border-green-400 shadow-green-200 scale-110 -translate-y-2' : 'border-green-100'}`}>
                            <div className="absolute -top-4 -right-4 bg-green-500 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold shadow-md border-2 border-white">
                              {groupIdx + 1}
                            </div>
                            <div className="text-sm font-bold text-green-600 mb-3 bg-green-50 px-3 py-1 rounded-full">第 {groupIdx + 1} 袋</div>
                            <div className="flex flex-wrap justify-center gap-2 w-[120px] min-h-[50px]">
                              {Array.from({ length: itemCount }).map((_, itemIdx) => (
                                <div key={itemIdx}>
                                  {renderItem("text-3xl", "animate-bounce-in")}
                                </div>
                              ))}
                              {/* 顯示空位虛線框 */}
                              {Array.from({ length: divisor - itemCount }).map((_, emptyIdx) => (
                                <div key={`empty-${emptyIdx}`} className="w-8 h-8 rounded-full border-2 border-dashed border-gray-200"></div>
                              ))}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  ) : (
                    status !== 'idle' && (
                      <div className="text-xl text-gray-500 font-medium py-10 text-center bg-white rounded-2xl border-2 border-dashed border-gray-300 max-w-md mx-auto">
                        ⚠️ 數量太少，連一袋 ({divisor}個) 都裝不滿喔！
                      </div>
                    )
                  )}
                </div>
              )}

              {/* 餘數區域 */}
              {status !== 'idle' && currentStep > distributableCount && remainder > 0 && (
                <div className="mt-12 pt-8 border-t-2 border-dashed border-gray-300 flex flex-col items-center animate-fade-in">
                  <div className="text-lg font-bold text-red-500 mb-4 bg-red-50 px-4 py-2 rounded-full flex items-center gap-2">
                    <span>剩下的物品 (無法{mode === 'sharing' ? '平分' : (mode === 'partitioning' ? '成組' : '裝滿一袋')})</span>
                    <span className="bg-red-500 text-white px-2 py-0.5 rounded-md text-sm">{currentStep - distributableCount}</span>
                  </div>
                  <div className="flex gap-3 bg-red-50/50 p-5 rounded-2xl border-2 border-red-200 min-h-[80px]">
                    {Array.from({ length: currentStep - distributableCount }).map((_, i) => (
                      <div key={`rem-${i}`} className="drop-shadow-sm">
                        {renderItem("text-4xl", "opacity-80 animate-bounce-in")}
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>

            {/* 算式與結論 */}
            <div className={`transition-all duration-700 overflow-hidden ${status === 'finished' ? 'max-h-[500px] opacity-100 p-8 bg-yellow-50 border-t-4 border-yellow-300' : 'max-h-0 opacity-0'}`}>
              <div className="text-center transform transition-all animate-bounce-in">
                <h2 className="text-2xl font-bold text-gray-700 mb-6 flex items-center justify-center gap-2">
                  <span className="bg-yellow-300 text-yellow-800 px-3 py-1 rounded-lg text-sm">計算結果</span>
                </h2>
                
                <div className="text-5xl md:text-6xl font-black text-gray-800 tracking-widest flex items-center justify-center gap-2 md:gap-4 font-mono">
                  <span className="bg-white px-4 py-2 rounded-xl shadow-sm">{total}</span>
                  <span className="text-gray-400 font-sans">÷</span>
                  <span className="bg-white px-4 py-2 rounded-xl shadow-sm">{divisor}</span>
                  <span className="text-gray-400 font-sans">=</span>
                  <span className="text-indigo-600 bg-indigo-100 px-4 py-2 rounded-xl shadow-sm">{quotient}</span>
                  {remainder > 0 && (
                    <span className="text-3xl text-red-500 ml-2 bg-red-100 px-4 py-3 rounded-xl shadow-sm whitespace-nowrap">
                      ... 餘 {remainder}
                    </span>
                  )}
                </div>
                
                <div className="mt-8 text-2xl font-medium text-gray-700 bg-white inline-block px-8 py-4 rounded-full shadow-sm border border-yellow-200">
                  {mode === 'sharing' && <span>每個人分到 <strong className="text-indigo-600 text-3xl mx-2">{quotient}</strong> 個{remainder > 0 ? `，還剩下 ${remainder} 個。` : '，剛好分完！'}</span>}
                  {mode === 'partitioning' && <span>每一組分到 <strong className="text-indigo-600 text-3xl mx-2">{quotient}</strong> 個{remainder > 0 ? `，還剩下 ${remainder} 個。` : '，剛好分完！'}</span>}
                  {mode === 'grouping' && <span>一共分成了 <strong className="text-indigo-600 text-3xl mx-2">{quotient}</strong> 袋{remainder > 0 ? `，還剩下 ${remainder} 個。` : '，剛好分完！'}</span>}
                </div>
              </div>
            </div>

          </div>
        </div>
      );
    }

    // 渲染應用程式
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
