<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>開心分蘋果：認識勻勻分 (除法)</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Canvas Confetti for Rewards -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;700;900&display=swap');

        body {
            font-family: 'Noto Sans HK', sans-serif;
            background-color: #f0f9ff;
            overflow: hidden; /* 防止手機/平板上下滑動 */
            touch-action: none; /* 禁用預設觸控行為，提升互動順暢度 */
            user-select: none; /* 防止文字被反白選取 */
        }

        /* 3D 按鈕質感 */
        .btn-3d {
            transition: all 0.1s;
            box-shadow: 0 8px 0 #0f172a, 0 15px 20px rgba(0,0,0,0.2);
        }
        .btn-3d:active {
            transform: translateY(8px);
            box-shadow: 0 0px 0 #0f172a, 0 5px 10px rgba(0,0,0,0.2);
        }

        /* 蘋果發光特效 (選中狀態) */
        .apple-glow {
            filter: drop-shadow(0 0 15px #facc15) drop-shadow(0 0 30px #facc15);
            transform: scale(1.15) translateY(-10px);
            z-index: 50;
        }

        /* 蘋果基本動畫 */
        .apple-transition {
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* 盤子選中提示 */
        .plate-pulse {
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(250, 204, 21, 0); }
            100% { box-shadow: 0 0 0 0 rgba(250, 204, 21, 0); }
        }

        /* 震動錯誤提示 */
        .shake-error {
            animation: shake 0.5s;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
        }

        /* 背景放射狀光芒 */
        .bg-rays {
            background: repeating-conic-gradient(
                from 0deg,
                #e0f2fe 0deg 15deg,
                #bae6fd 15deg 30deg
            );
            animation: rotate-rays 60s linear infinite;
        }
        @keyframes rotate-rays {
            from { transform: rotate(0deg) scale(1.5); }
            to { transform: rotate(360deg) scale(1.5); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 廣東話語音功能 ---
        const speak = (text, rate = 0.85) => {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel(); // 停止先前的語音
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-HK'; // 設定為廣東話
            utterance.rate = rate;    // 語速稍慢，適合特教生
            utterance.pitch = 1.1;    // 音調稍高，顯得較有活力
            window.speechSynthesis.speak(utterance);
        };

        // --- 音效播放 ---
        const playSound = (type) => {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gainNode = ctx.createGain();
            osc.connect(gainNode);
            gainNode.connect(ctx.destination);

            if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } else if (type === 'success') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                osc.frequency.setValueAtTime(600, ctx.currentTime + 0.1);
                osc.frequency.setValueAtTime(800, ctx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(150, ctx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            }
        };

        // --- 慶祝特效 ---
        const triggerConfetti = () => {
            playSound('success');
            const duration = 3000;
            const end = Date.now() + duration;

            const frame = () => {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ef4444', '#3b82f6', '#10b981', '#f59e0b']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ef4444', '#3b82f6', '#10b981', '#f59e0b']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            };
            frame();
        };

        // --- 共用組件：3D蘋果 ---
        const Apple = ({ isSelected, onClick, style, className = "" }) => (
            <div 
                onClick={onClick}
                className={`relative cursor-pointer transition-all duration-300 ${isSelected ? 'apple-glow' : 'hover:scale-110 active:scale-95'} ${className}`}
                style={{ width: '80px', height: '80px', ...style }}
            >
                <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-lg">
                    <defs>
                        <radialGradient id="appleGrad" cx="30%" cy="30%" r="70%">
                            <stop offset="0%" stopColor="#ff7b7b" />
                            <stop offset="60%" stopColor="#e11d48" />
                            <stop offset="100%" stopColor="#9f1239" />
                        </radialGradient>
                        <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stopColor="#4ade80" />
                            <stop offset="100%" stopColor="#166534" />
                        </linearGradient>
                    </defs>
                    {/* 蘋果主體 */}
                    <path d="M 50 20 C 70 10, 95 30, 90 60 C 85 90, 60 95, 50 90 C 40 95, 15 90, 10 60 C 5 30, 30 10, 50 20 Z" fill="url(#appleGrad)" />
                    {/* 葉子 */}
                    <path d="M 50 20 C 40 5, 60 5, 70 10 C 60 20, 50 20, 50 20 Z" fill="url(#leafGrad)" />
                    {/* 梗 */}
                    <path d="M 50 20 C 48 10, 52 5, 55 2" stroke="#78350f" strokeWidth="3" fill="none" strokeLinecap="round" />
                    {/* 高光 */}
                    <path d="M 25 35 C 35 25, 45 30, 45 30 C 45 30, 35 40, 25 35 Z" fill="rgba(255,255,255,0.4)" />
                </svg>
            </div>
        );

        // --- 共用組件：3D盤子 ---
        const Plate = ({ children, onClick, highlight }) => (
            <div 
                onClick={onClick}
                className={`relative flex items-center justify-center cursor-pointer transition-all duration-300
                    ${highlight ? 'plate-pulse' : 'hover:scale-105'}`}
                style={{ width: '160px', height: '100px' }}
            >
                <div className="absolute inset-0 bg-gradient-to-br from-gray-100 to-gray-300 rounded-[100px] shadow-[0_10px_15px_-3px_rgba(0,0,0,0.3)] border-b-4 border-gray-400">
                    <div className="absolute inset-2 bg-gradient-to-tl from-gray-200 to-gray-50 rounded-[80px] shadow-inner opacity-80"></div>
                </div>
                {/* 顯示放在盤子上的蘋果 */}
                <div className="relative z-10 flex gap-[-20px] justify-center w-full">
                    {children}
                </div>
            </div>
        );

        // ==========================================
        // 首頁選單
        // ==========================================
        const Menu = ({ onStart }) => {
            useEffect(() => {
                speak("歡迎黎到開心分蘋果！我哋一齊學勻勻分啦！");
            }, []);

            return (
                <div className="w-full h-full flex flex-col items-center justify-center z-10 relative">
                    <h1 className="text-5xl md:text-7xl font-black text-rose-600 mb-8 drop-shadow-[0_4px_4px_rgba(255,255,255,0.8)] text-center tracking-wide">
                        開心分蘋果<br/>
                        <span className="text-4xl md:text-5xl text-blue-600 mt-4 block">認識「勻勻分」</span>
                    </h1>
                    
                    <div className="flex gap-4 mb-12 animate-bounce">
                        <Apple isSelected={false} />
                        <Apple isSelected={false} />
                        <Apple isSelected={false} />
                    </div>

                    <button 
                        onClick={() => {
                            playSound('pop');
                            onStart('level1');
                        }}
                        className="btn-3d bg-rose-500 text-white text-4xl font-bold py-6 px-16 rounded-full flex items-center gap-4"
                    >
                        <i data-lucide="play-circle" className="w-10 h-10"></i>
                        開始遊戲
                    </button>
                </div>
            );
        };

        // ==========================================
        // 第一關：暖身數數 (建立自信)
        // ==========================================
        const Level1 = ({ onComplete }) => {
            const [apples, setApples] = useState([
                { id: 1, clicked: false },
                { id: 2, clicked: false },
                { id: 3, clicked: false }
            ]);

            useEffect(() => {
                speak("第一關！點擊下畫面入面嘅蘋果，數下有幾多個？");
            }, []);

            const handleAppleClick = (id) => {
                const apple = apples.find(a => a.id === id);
                if (apple.clicked) return;

                playSound('pop');
                
                const newApples = apples.map(a => a.id === id ? { ...a, clicked: true } : a);
                setApples(newApples);

                const clickedCount = newApples.filter(a => a.clicked).length;
                speak(clickedCount.toString());

                if (clickedCount === apples.length) {
                    setTimeout(() => {
                        triggerConfetti();
                        speak("好叻仔！總共有3個蘋果！準備去下一關啦！");
                        setTimeout(() => onComplete('level2'), 3500);
                    }, 500);
                }
            };

            return (
                <div className="w-full h-full flex flex-col items-center justify-center p-6">
                    <div className="bg-white/80 backdrop-blur-sm rounded-3xl p-6 mb-12 shadow-xl border-4 border-blue-200 text-center">
                        <h2 className="text-4xl font-bold text-blue-800 flex items-center justify-center gap-3">
                            <span className="text-5xl">👆</span> 點擊所有蘋果
                        </h2>
                    </div>

                    <div className="flex gap-8 md:gap-16">
                        {apples.map((apple) => (
                            <div key={apple.id} className={`transition-all duration-700 ${apple.clicked ? 'opacity-30 scale-75' : 'animate-bounce'}`}>
                                <Apple 
                                    onClick={() => handleAppleClick(apple.id)}
                                    style={{ width: '120px', height: '120px' }}
                                />
                            </div>
                        ))}
                    </div>
                    
                    <button 
                        onClick={() => speak("點擊下畫面入面嘅蘋果，數下有幾多個？")}
                        className="mt-20 bg-blue-100 text-blue-800 text-2xl font-bold py-3 px-8 rounded-full flex items-center gap-3 shadow-md active:bg-blue-200"
                    >
                        🔊 聽多次
                    </button>
                </div>
            );
        };

        // ==========================================
        // 第二關：學習概念 (自動示範)
        // ==========================================
        const Level2 = ({ onComplete }) => {
            const [step, setStep] = useState(0); // 0: 初始, 1: 正在分, 2: 分完
            const [apples, setApples] = useState([
                { id: 1, plateId: null },
                { id: 2, plateId: null },
                { id: 3, plateId: null },
                { id: 4, plateId: null }
            ]);

            useEffect(() => {
                speak("第二關！我哋有4個蘋果，要『勻勻分』落2隻碟度。即係每隻碟都要一樣多！睇下點分？");
            }, []);

            const startSharing = () => {
                if (step !== 0) return;
                setStep(1);
                speak("我哋一個一個咁分...");
                
                let currentStep = 0;
                const interval = setInterval(() => {
                    if (currentStep >= 4) {
                        clearInterval(interval);
                        setStep(2);
                        triggerConfetti();
                        speak("分完啦！每隻碟都有2個蘋果，一樣多呀！呢個就係『勻勻分』啦！");
                        return;
                    }
                    
                    playSound('pop');
                    // 將當前的 step 儲存為常數，以防止 React 非同步更新時發生閉包變數狀態錯誤
                    const indexToUpdate = currentStep;
                    setApples(prev => prev.map((apple, index) => 
                        index === indexToUpdate ? { ...apple, plateId: (indexToUpdate % 2) + 1 } : apple
                    ));
                    currentStep++;
                }, 1000); // 每秒分一個，速度慢，讓學生看清楚
            };

            return (
                <div className="w-full h-full flex flex-col items-center justify-between py-12 px-6">
                    {/* 標題與語音 */}
                    <div className="bg-white/80 backdrop-blur-sm rounded-3xl p-6 shadow-xl border-4 border-rose-200 text-center w-full max-w-2xl">
                        <h2 className="text-3xl md:text-4xl font-bold text-rose-800 flex items-center justify-center gap-3">
                            <span className="text-5xl">👀</span> 睇下點樣「勻勻分」
                        </h2>
                    </div>

                    {/* 頂部蘋果區 (未分配) */}
                    <div className="flex gap-4 h-24 mt-8">
                        {apples.filter(a => a.plateId === null).map(a => (
                            <Apple key={a.id} className="apple-transition" />
                        ))}
                    </div>

                    {/* 中間大按鈕 */}
                    {step === 0 && (
                        <button 
                            onClick={startSharing}
                            className="btn-3d bg-rose-500 text-white text-3xl font-bold py-4 px-12 rounded-full animate-bounce my-8"
                        >
                            開始分蘋果
                        </button>
                    )}
                    {step === 2 && (
                        <button 
                            onClick={() => onComplete('level3')}
                            className="btn-3d bg-green-500 text-white text-3xl font-bold py-4 px-12 rounded-full my-8"
                        >
                            我明啦，下一關！ ➔
                        </button>
                    )}

                    {/* 底部盤子區 */}
                    <div className="flex gap-12 md:gap-24 mb-10">
                        <Plate>
                            {apples.filter(a => a.plateId === 1).map((a, idx) => (
                                <div key={a.id} className="absolute apple-transition" style={{ left: `${30 + idx * 30}px`, bottom: '20px' }}>
                                    <Apple style={{ width: '60px', height: '60px' }} />
                                </div>
                            ))}
                        </Plate>
                        <Plate>
                            {apples.filter(a => a.plateId === 2).map((a, idx) => (
                                <div key={a.id} className="absolute apple-transition" style={{ left: `${30 + idx * 30}px`, bottom: '20px' }}>
                                    <Apple style={{ width: '60px', height: '60px' }} />
                                </div>
                            ))}
                        </Plate>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 第三關：自己動手做 (互動挑戰)
        // ==========================================
        const Level3 = ({ onBackToMenu }) => {
            const [apples, setApples] = useState([
                { id: 1, plateId: null }, { id: 2, plateId: null },
                { id: 3, plateId: null }, { id: 4, plateId: null },
                { id: 5, plateId: null }, { id: 6, plateId: null }
            ]);
            const [selectedAppleId, setSelectedAppleId] = useState(null);
            const [hasError, setHasError] = useState(false);

            useEffect(() => {
                speak("到你啦！將6個蘋果『勻勻分』落3隻碟度。先㩒下蘋果，再㩒下想放嘅碟啦！");
            }, []);

            // 處理點擊蘋果
            const handleAppleClick = (id) => {
                playSound('pop');
                setHasError(false);
                if (selectedAppleId === id) {
                    setSelectedAppleId(null); // 取消選取
                } else {
                    setSelectedAppleId(id); // 選取
                    
                    // 如果點擊的是已經在盤子上的蘋果，將它拿回上面
                    const apple = apples.find(a => a.id === id);
                    if (apple.plateId !== null) {
                        setApples(prev => prev.map(a => a.id === id ? { ...a, plateId: null } : a));
                        setSelectedAppleId(null); // 拿回上面後自動取消選取狀態
                    }
                }
            };

            // 處理點擊盤子
            const handlePlateClick = (plateId) => {
                if (selectedAppleId !== null) {
                    playSound('pop');
                    setApples(prev => prev.map(a => a.id === selectedAppleId ? { ...a, plateId } : a));
                    setSelectedAppleId(null); // 放下後取消選取
                    setHasError(false);
                } else {
                    speak("請先點擊上面嘅蘋果，然後再點擊呢隻碟啦。");
                }
            };

            // 檢查答案
            const checkAnswer = () => {
                const unassigned = apples.filter(a => a.plateId === null).length;
                if (unassigned > 0) {
                    setHasError(true);
                    speak("仲有蘋果未分完喎，將佢哋全部放落碟度啦！");
                    return;
                }

                // 計算每個盤子的蘋果數量
                const count1 = apples.filter(a => a.plateId === 1).length;
                const count2 = apples.filter(a => a.plateId === 2).length;
                const count3 = apples.filter(a => a.plateId === 3).length;

                if (count1 === 2 && count2 === 2 && count3 === 2) {
                    // 正確
                    setHasError(false);
                    triggerConfetti();
                    speak("超級叻仔呀！每隻碟都有2個蘋果，你識得『勻勻分』啦！除法就係咁簡單！");
                    setTimeout(() => onBackToMenu(), 6000);
                } else {
                    // 錯誤
                    setHasError(true);
                    playSound('error');
                    speak("哎呀，每隻碟嘅蘋果唔一樣多喎，有啲多有啲少。試下喺多嘅碟度，攞返啲出嚟啦！");
                }
            };

            return (
                <div className={`w-full h-full flex flex-col items-center justify-between py-6 px-4 ${hasError ? 'shake-error' : ''}`}>
                    {/* 頂部指示區 */}
                    <div className="w-full max-w-3xl flex justify-between items-center mb-4">
                        <button 
                            onClick={() => speak("將6個蘋果勻勻分落3隻碟度。先㩒下蘋果，再㩒下想放嘅碟啦！")}
                            className="bg-blue-100 text-blue-800 text-xl font-bold py-3 px-6 rounded-full flex items-center gap-2 shadow-sm active:bg-blue-200"
                        >
                            🔊 聽指示
                        </button>
                        <div className="bg-white/90 rounded-2xl px-6 py-2 shadow-md border-2 border-yellow-300">
                            <p className="text-xl font-bold text-gray-700">先點擊🍎 ➔ 再點擊🍽️</p>
                        </div>
                    </div>

                    {/* 蘋果池 (上方) */}
                    <div className="bg-blue-50/50 rounded-[40px] p-6 min-h-[140px] w-full max-w-3xl border-4 border-dashed border-blue-200 flex flex-wrap justify-center items-center gap-4 shadow-inner">
                        {apples.filter(a => a.plateId === null).length === 0 && (
                            <span className="text-2xl font-bold text-gray-400">全部蘋果已經攞出嚟啦</span>
                        )}
                        {apples.filter(a => a.plateId === null).map(a => (
                            <Apple 
                                key={a.id} 
                                isSelected={selectedAppleId === a.id}
                                onClick={() => handleAppleClick(a.id)}
                            />
                        ))}
                    </div>

                    {/* 盤子區 (下方) */}
                    <div className="flex gap-4 md:gap-16 my-8 w-full max-w-4xl justify-center px-4">
                        {[1, 2, 3].map(plateId => (
                            <Plate 
                                key={plateId} 
                                onClick={() => handlePlateClick(plateId)}
                                highlight={selectedAppleId !== null} // 當有蘋果被選中時，盤子發光提示可以點擊
                            >
                                {apples.filter(a => a.plateId === plateId).map((a, idx) => (
                                    <div 
                                        key={a.id} 
                                        className="absolute z-20"
                                        style={{ 
                                            left: `${20 + idx * 30}px`, 
                                            bottom: '25px',
                                            transition: 'all 0.4s ease'
                                        }}
                                    >
                                        <Apple 
                                            isSelected={selectedAppleId === a.id}
                                            onClick={(e) => {
                                                e.stopPropagation(); // 防止點擊蘋果時觸發盤子的點擊
                                                handleAppleClick(a.id);
                                            }}
                                            style={{ width: '65px', height: '65px' }} 
                                        />
                                    </div>
                                ))}
                            </Plate>
                        ))}
                    </div>

                    {/* 檢查按鈕 */}
                    <button 
                        onClick={checkAnswer}
                        className="btn-3d bg-green-500 text-white text-4xl font-bold py-5 px-16 rounded-full mt-4 mb-4 flex items-center gap-3"
                    >
                        <span className="text-5xl">✅</span> 分好啦！
                    </button>
                </div>
            );
        };

        // ==========================================
        // 主程式 (App)
        // ==========================================
        const App = () => {
            const [level, setLevel] = useState('menu'); // menu, level1, level2, level3

            useEffect(() => {
                // 初始化語音引擎
                if (window.speechSynthesis) {
                    window.speechSynthesis.getVoices();
                }
            }, []);

            return (
                <div className="absolute inset-0 flex items-center justify-center">
                    {/* 放射狀動態背景 */}
                    <div className="absolute inset-[-50%] bg-rays -z-10"></div>
                    
                    {/* 主內容容器 (確保平板與電腦上絕對置中且比例正確) */}
                    <div className="w-full max-w-[1024px] h-full max-h-[768px] relative bg-transparent flex flex-col items-center justify-center overflow-hidden">
                        {level === 'menu' && <Menu onStart={setLevel} />}
                        {level === 'level1' && <Level1 onComplete={setLevel} />}
                        {level === 'level2' && <Level2 onComplete={setLevel} />}
                        {level === 'level3' && <Level3 onBackToMenu={() => setLevel('menu')} />}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
