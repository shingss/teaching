<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>認識除號 2.0：小步子慢學版</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@700;900&display=swap');
        
        body {
            font-family: 'Noto Sans HK', sans-serif;
            background-color: #FDF2F8; /* 淺粉色背景，溫和舒適 */
            overflow: hidden;
            user-select: none;
            touch-action: manipulation;
        }

        .btn-3d {
            box-shadow: 0 10px 0 rgba(0,0,0,0.15);
            transition: all 0.1s;
        }
        .btn-3d:active:not(:disabled) {
            box-shadow: 0 0px 0 rgba(0,0,0,0.15);
            transform: translateY(10px);
        }

        .division-symbol {
            color: #db2777;
            text-shadow: 4px 4px 0px rgba(219, 39, 119, 0.2);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .shake { animation: shake 0.5s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .pop-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 餅乾飛行動畫 */
        .cookie-fly {
            animation: flyToPlate 1s forwards;
        }
        @keyframes flyToPlate {
            100% { transform: translateY(150px) scale(0.5); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 語音引擎 (確保發聲流暢)
        const speak = (text) => {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-HK';
            utterance.rate = 0.85; // 慢速，字字清晰
            utterance.pitch = 1.1; // 比較親切嘅高音
            window.speechSynthesis.speak(utterance);
        };

        const App = () => {
            const [step, setStep] = useState('start'); // start, intro, find_easy, find_hard, concept, play, end
            const [errorShakeIndex, setErrorShakeIndex] = useState(null);
            
            // Hard Mode 狀態
            const [foundIndices, setFoundIndices] = useState([]);
            const hardSymbols = ['+', '÷', '-', '÷', '×', '÷'];
            
            // Play Mode 狀態
            const [isShared, setIsShared] = useState(false);

            // 1. 開始頁面 (必須由使用者點擊以啟動音頻)
            if (step === 'start') {
                return (
                    <div className="h-screen flex flex-col items-center justify-center bg-pink-50 p-6 text-center">
                        <div className="text-[120px] mb-8 animate-bounce">🪄</div>
                        <h1 className="text-7xl font-black text-pink-600 mb-12">認識除號</h1>
                        <button 
                            onClick={() => {
                                setStep('intro');
                                speak("你好呀！今日我哋一齊識下呢個新朋友，佢叫做，除號。");
                            }}
                            className="btn-3d bg-pink-500 text-white text-5xl font-black py-8 px-24 rounded-full"
                        >
                            開始上堂
                        </button>
                    </div>
                );
            }

            // 2. 介紹畫面 (淨係睇同聽)
            if (step === 'intro') {
                return (
                    <div className="h-screen flex flex-col items-center justify-center p-8 text-center bg-white pop-in">
                        <div className="division-symbol text-[250px] leading-none mb-8">÷</div>
                        <p className="text-5xl font-bold text-gray-700 mb-6 bg-pink-100 p-6 rounded-3xl">
                            呢個係<span className="text-pink-600 font-black text-6xl mx-2">除號</span>
                        </p>
                        <p className="text-3xl font-bold text-gray-500 mb-16">
                            一條橫線，上下兩粒點。
                        </p>
                        <button 
                            onClick={() => { 
                                setStep('find_easy'); 
                                speak("試下搵出除號。邊個係除號？撳下佢啦。"); 
                            }}
                            className="btn-3d bg-green-500 text-white text-4xl font-black py-6 px-16 rounded-full"
                        >
                            我認得喇
                        </button>
                    </div>
                );
            }

            // 3. 簡單辨認 (二選一，建立自信)
            if (step === 'find_easy') {
                return (
                    <div className="h-screen flex flex-col items-center justify-center p-6 bg-blue-50 pop-in">
                        <h2 className="text-5xl font-black text-blue-600 mb-16">邊一個係除號？</h2>
                        <div className="flex gap-16">
                            <button 
                                onClick={() => {
                                    setErrorShakeIndex(0);
                                    speak("唔係呢個喔，呢個係加號。除號有一條橫線，上下兩粒點。");
                                    setTimeout(() => setErrorShakeIndex(null), 500);
                                }}
                                className={`btn-3d bg-white w-48 h-48 rounded-[40px] text-[100px] font-black text-blue-400 flex items-center justify-center border-8 border-transparent ${errorShakeIndex === 0 ? 'shake border-red-300' : ''}`}
                            >
                                +
                            </button>
                            <button 
                                onClick={() => {
                                    confetti({ particleCount: 50, spread: 60 });
                                    speak("叻仔！呢個就係除號喇！");
                                    setTimeout(() => {
                                        setStep('find_hard');
                                        speak("依家變多咗符號，請你搵晒 3 個除號出嚟。");
                                    }, 2500);
                                }}
                                className="btn-3d bg-white w-48 h-48 rounded-[40px] text-[100px] font-black text-pink-500 flex items-center justify-center active:bg-pink-50"
                            >
                                ÷
                            </button>
                        </div>
                    </div>
                );
            }

            // 4. 進階辨認 (修復重覆點擊Bug，必須搵出不同嘅除號)
            if (step === 'find_hard') {
                return (
                    <div className="h-screen flex flex-col items-center justify-center p-6 bg-indigo-50 pop-in">
                        <h2 className="text-5xl font-black text-indigo-600 mb-4">搵出所有除號</h2>
                        <p className="text-3xl text-gray-600 font-bold mb-12">仲差 {3 - foundIndices.length} 個未搵到</p>
                        
                        <div className="grid grid-cols-3 gap-8 max-w-4xl">
                            {hardSymbols.map((char, index) => {
                                const isFound = foundIndices.includes(index);
                                return (
                                    <button 
                                        key={index}
                                        disabled={isFound}
                                        onClick={() => {
                                            if (char === '÷') {
                                                const newFound = [...foundIndices, index];
                                                setFoundIndices(newFound);
                                                speak("搵到一個喇！");
                                                
                                                if (newFound.length === 3) {
                                                    setTimeout(() => {
                                                        confetti({ particleCount: 150, spread: 80 });
                                                        speak("嘩，好眼力！你搵晒所有除號喇！");
                                                        setTimeout(() => {
                                                            setStep('concept');
                                                            speak("咁除號代表乜嘢呢？除號就係代表，平均分畀大家。");
                                                        }, 4000);
                                                    }, 500);
                                                }
                                            } else {
                                                setErrorShakeIndex(index);
                                                speak("睇真啲？除號有一條橫線，上下兩粒點㗎。");
                                                setTimeout(() => setErrorShakeIndex(null), 500);
                                            }
                                        }}
                                        className={`
                                            btn-3d w-40 h-40 rounded-3xl text-7xl font-bold flex items-center justify-center transition-all duration-300
                                            ${isFound ? 'bg-green-100 text-green-500 scale-95 shadow-none' : 'bg-white text-gray-700'}
                                            ${errorShakeIndex === index ? 'shake bg-red-50 text-red-400' : ''}
                                        `}
                                        style={{ color: !isFound && char==='÷' ? '#ec4899' : '' }} // 暗示少少顏色
                                    >
                                        {isFound ? '✅' : char}
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                );
            }

            // 5. 概念連結 (聽故事)
            if (step === 'concept') {
                return (
                    <div className="h-screen flex flex-col items-center justify-center p-8 text-center bg-yellow-50 pop-in">
                        <h2 className="text-5xl font-black text-orange-600 mb-12">除號代表乜嘢？</h2>
                        
                        <div className="flex items-center justify-center gap-8 mb-16 bg-white p-12 rounded-[50px] shadow-lg">
                            <div className="text-[120px] text-pink-500 animate-pulse">÷</div>
                            <div className="text-7xl text-gray-300 mx-4">👉</div>
                            <div className="flex flex-col items-center">
                                <span className="text-7xl mb-4">🎁🎁</span>
                                <div className="text-4xl text-blue-500 font-bold bg-blue-100 px-6 py-2 rounded-full">平均分</div>
                                <div className="flex gap-16 mt-6">
                                    <span className="text-7xl">👦</span>
                                    <span className="text-7xl">👧</span>
                                </div>
                            </div>
                        </div>

                        <button 
                            onClick={() => { 
                                setStep('play'); 
                                speak("最後挑戰！請你撳下個除號，將4塊餅，平均分畀2個小朋友。"); 
                            }}
                            className="btn-3d bg-orange-500 text-white text-4xl font-black py-8 px-20 rounded-full"
                        >
                            我明白喇，去挑戰！
                        </button>
                    </div>
                );
            }

            // 6. 實戰演練 (強化因果：符號 = 動作)
            if (step === 'play') {
                return (
                    <div className="h-screen flex flex-col items-center justify-center p-6 bg-green-50 pop-in">
                        <h2 className="text-4xl font-black text-green-700 mb-8 bg-green-100 px-8 py-4 rounded-full">
                            撳「除號」，幫手分餅乾啦！
                        </h2>
                        
                        <div className="flex items-center gap-6 bg-white p-12 rounded-[60px] shadow-xl border-8 border-green-100">
                            {/* 4塊餅乾 */}
                            <div className="flex flex-col items-center relative w-48">
                                <div className="flex flex-wrap justify-center gap-2 h-32">
                                    {!isShared ? (
                                        <>
                                            <span className="text-6xl">🍪</span><span className="text-6xl">🍪</span>
                                            <span className="text-6xl">🍪</span><span className="text-6xl">🍪</span>
                                        </>
                                    ) : (
                                        <div className="text-4xl font-bold text-gray-300 mt-8">分咗喇</div>
                                    )}
                                </div>
                                <div className="text-6xl font-black text-gray-700 mt-4">4</div>
                            </div>
                            
                            {/* 互動按鈕：除號 */}
                            <div className="flex flex-col items-center mx-4">
                                {!isShared ? (
                                    <button 
                                        onClick={() => {
                                            speak("分餅乾喇！4 除以 2，每人分到 2 塊！");
                                            setIsShared(true);
                                            setTimeout(() => {
                                                confetti({ particleCount: 200, spread: 100 });
                                                setTimeout(() => setStep('end'), 5000);
                                            }, 1000);
                                        }}
                                        className="btn-3d bg-pink-100 p-6 rounded-[40px] text-8xl text-pink-500 border-4 border-pink-300 animate-pulse hover:bg-pink-200"
                                    >
                                        ÷
                                    </button>
                                ) : (
                                    <div className="p-6 rounded-[40px] text-8xl text-pink-500 font-black">÷</div>
                                )}
                            </div>

                            {/* 2個小朋友 */}
                            <div className="flex flex-col items-center w-48">
                                <div className="flex gap-4 h-32 items-end">
                                    <div className="flex flex-col items-center">
                                        {isShared && <div className="text-4xl pop-in mb-2">🍪🍪</div>}
                                        <span className="text-7xl">👦</span>
                                    </div>
                                    <div className="flex flex-col items-center">
                                        {isShared && <div className="text-4xl pop-in mb-2">🍪🍪</div>}
                                        <span className="text-7xl">👧</span>
                                    </div>
                                </div>
                                <div className="text-6xl font-black text-gray-700 mt-4">2</div>
                            </div>

                            <div className="text-6xl font-black text-gray-400 mx-4">=</div>

                            {/* 答案 */}
                            <div className="flex flex-col items-center w-32">
                                <div className="h-32 flex items-end">
                                    {isShared && <div className="text-8xl font-black text-green-500 pop-in">2</div>}
                                </div>
                                {isShared && <div className="text-4xl font-bold text-green-600 mt-4 pop-in">塊</div>}
                            </div>
                        </div>
                    </div>
                );
            }

            // 7. 完美過關
            if (step === 'end') {
                return (
                    <div className="h-screen flex flex-col items-center justify-center p-8 text-center bg-yellow-50 pop-in">
                        <div className="text-[150px] mb-8 animate-bounce">🏆</div>
                        <h1 className="text-6xl font-black text-orange-500 mb-8">你好叻呀！</h1>
                        <p className="text-4xl text-gray-700 font-bold mb-16 leading-relaxed">
                            你已經識得<span className="text-pink-600 text-6xl mx-2">除號</span>喇！<br/>
                            識得將啲嘢平均分畀大家！
                        </p>
                        <button 
                            onClick={() => {
                                setStep('start');
                                setFoundIndices([]);
                                setIsShared(false);
                            }}
                            className="btn-3d bg-blue-500 text-white text-4xl font-black py-8 px-20 rounded-full"
                        >
                            再玩一次
                        </button>
                    </div>
                );
            }
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
